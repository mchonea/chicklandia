  #touch button.down{background:rgba(255,216,58,.92);transform:scale(.94)}
  #touch .act{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
  #touch .act b{font-size:20px;font-weight:normal}
  #touch .act small{font-size:7px}
  #btnA{background:rgba(255,150,150,.75)!important}
  #btnA.down,#btnB.down{background:rgba(255,216,58,.92)!important}
  #dpad{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(255,248,236,.10)}

    display:flex;align-items:center;justify-content:center;font-size:12px}
  #dpad .u,#dpad .d{left:33%;width:34%;height:39%}
  #dpad .u{top:0;border-radius:10px 10px 0 0}
  #dpad .d{bottom:0;border-radius:0 0 10px 10px}
  #dpad .l,#dpad .r{top:33%;height:34%;width:39%}
  #dpad .l{left:0;border-radius:10px 0 0 10px}
  #dpad .r{right:0;border-radius:0 10px 10px 0}
  #dpad .hub{position:absolute;left:31%;top:31%;width:38%;height:38%;background:rgba(255,248,236,.62)}
  #dpad .on{background:rgba(255,216,58,.92)}
  #menu{position:absolute;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
  #menu button{position:static;pointer-events:auto;font-size:7px;min-width:44px;height:34px;padding:0 6px}

  <div id="menu">
    <button data-k="grow">GROW</button><button data-k="quest">QUESTS</button><button data-k="wear">OUTFIT</button><button data-k="fly" id="btnMap">MAP</button>
    <button data-k="pause">&#9776;</button><button data-k="back">&#10005;</button><button data-k="mute">&#9835;</button><button data-k="full" id="btnFull">&#9974;</button>
  </div>
</div>
<script>
'use strict';
/* ===== src/engine/canvas.js ===== */
/* =====================================================================
   CHICKLANDIA - a tiny chick's big dream
   ===================================================================== */
const W=256,H=224,HUD=32,TS=16,VW=256,VH=192,TOTAL_SEEDS=45,TOTAL_SEEDS2=38,DAY=18000;
const FONT='"Press Start 2P", monospace';
const SAVE_KEY='chicklandia_save_v2';

const cv=document.getElementById('c'),dctx=cv.getContext('2d');
const pix=document.createElement('canvas');pix.width=W;pix.height=H;
const ctx=pix.getContext('2d');ctx.imageSmoothingEnabled=false;
let K=1,OX=0,OY=0,TOUCH=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
function resize(){
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.floor(innerWidth*dpr);cv.height=Math.floor(innerHeight*dpr);
  const portrait=TOUCH&&innerHeight>innerWidth;            // phones held upright: game on top, controls below
  let k=Math.min(cv.width/W,(portrait?cv.height*0.58:cv.height)/H);if(k>=2&&!TOUCH){const f=Math.floor(k);if(k/f<1.12)k=f;}   // crisp whole-number pixels, unless that would leave a big empty border: then fill the window
  K=k;OX=Math.floor((cv.width-W*K)/2);OY=portrait?Math.floor(10*dpr):Math.floor((cv.height-H*K)/2);
  layoutTouch();
}
function layoutTouch(){
  const T=document.getElementById('touch');if(!T)return;T.classList.toggle('on',TOUCH);if(!TOUCH)return;
  const dpr=window.devicePixelRatio||1,vw=innerWidth,vh=innerHeight,gx=OX/dpr,gy=OY/dpr,gh=H*K/dpr;
  const S=(id,o)=>{const el=document.getElementById(id);for(const k in o)el.style[k]=typeof o[k]==='number'?o[k]+'px':o[k];};
  const safe=v=>'calc('+v+'px + env(safe-area-inset-bottom))';
  if(vh>vw){
    const top=gy+gh+10,area=vh-top;
    S('menu',{left:'8px',right:'8px',top,justifyContent:'center'});
    const pad=Math.max(110,Math.min(180,area-90,vw*0.46));
    S('dpad',{left:'14px',bottom:safe(16),width:pad,height:pad});
    const a=Math.min(88,pad*0.56),b=Math.round(a*0.78);
    S('btnA',{right:'16px',left:'auto',bottom:safe(16+pad*0.42),width:a,height:a});
    S('btnB',{right:(24+a)+'px',left:'auto',bottom:safe(14),width:b,height:b});
    S('btnD',{right:(32+a+b)+'px',left:'auto',bottom:safe(14),width:b,height:b});
  }else{
    const bar=gx,big=bar>=130;
    const pad=Math.min(big?bar-24:150,vh*0.48,170);
    S('dpad',{left:(big?(bar-pad)/2:14)+'px',bottom:safe(18),width:pad,height:pad});
    const a=Math.min(84,big?bar*0.46:78),b=Math.round(a*0.78);
    S('btnA',{right:(big?(bar-a)/2:16)+'px',left:'auto',bottom:safe(24+b),width:a,height:a});
    S('btnB',{right:(big?Math.max(6,(bar-a)/2-b*0.35):24+a)+'px',left:'auto',bottom:safe(12),width:b,height:b});
    S('btnD',{right:(big?(bar-a)/2:16)+'px',left:'auto',bottom:safe(32+a+b),width:b,height:b});
    if(big)S('menu',{left:(vw-bar+8)+'px',right:'8px',top:'8px',justifyContent:'center'});
    else S('menu',{left:'8px',right:'8px',top:'6px',justifyContent:'flex-end'});
  }
}
addEventListener('resize',resize);resize();


/* ===== src/engine/gfx.js ===== */
/* ---------------- palette & helpers ---------------- */
// Bright Adventure: cool ink, leafy shadows, warm gold and clear blue water.
const PAL={k:'#202840',w:'#fff8ec',y:'#ffe05a',Y:'#e8a02c',o:'#f07832',r:'#eb6654',R:'#a43d43',
  p:'#f6a6b6',P:'#d06f8a',b:'#a66c46',B:'#594437',g:'#55aa62',G:'#2d664e',l:'#a1d970',u:'#409dc5',
  U:'#306a9d',c:'#b2e7e0',e:'#a9b7c5',E:'#64758b',t:'#e8cd98',T:'#b69965',n:'#f6ead0',f:'#ec6c24',
  q:'#ffd21e',Q:'#c98a00',m:'#7a5230',O:'#b85432'};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0;}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x);return c;}
function P_(x,col,i,j,w=1,h=1){x.fillStyle=PAL[col]||col;x.fillRect(i,j,w,h);}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function makeSprite(rows,outline=true){
  const pad=outline?1:0,h=rows.length,w=Math.max(...rows.map(r=>r.length));
  return mk(w+pad*2,h+pad*2,x=>{
    const filled=(i,j)=>{if(j<0||j>=h)return false;const ch=rows[j][i];return !!ch&&ch!=='.'&&ch!==' ';};
    if(outline){x.fillStyle=PAL.k;
      for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(filled(i,j))continue;
        if(filled(i-1,j)||filled(i+1,j)||filled(i,j-1)||filled(i,j+1))x.fillRect(i+pad,j+pad,1,1);}}
    for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(ch==='.'||ch===' ')continue;
      x.fillStyle=PAL[ch]||'#f0f';x.fillRect(i+pad,j+pad,1,1);}
  });
}
const flipMap=new WeakMap();
function flipOf(c){let f=flipMap.get(c);if(f)return f;
  f=mk(c.width,c.height,x=>{x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);});flipMap.set(c,f);return f;}


/* ===== src/engine/coastal_art.js ===== */
/* Shared pixel artwork for the sea chart, sailing vignette and moored ships.
   Ship variants are cached by the three independent upgrade bits. */
const COAST={ink:'#202840',paper:'#fff8ec',sand:'#e8cd98',sandLight:'#f6ead0',sandShadow:'#b69965',green:'#55aa62',leaf:'#a1d970',forest:'#2d664e',deep:'#204a74',water:'#306a9d',shallow:'#60bfc6',foam:'#b2e7e0',wood:'#a66c46',woodLight:'#ce9560',woodDark:'#594437',red:'#eb6654',gold:'#ffe05a',rock:'#64758b',rockLight:'#a9b7c5'};
function coastRect(g,color,x,y,w=1,h=1){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function coastPoly(g,color,points){g.fillStyle=color;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill();}
function coastLine(g,color,points,width=1){g.strokeStyle=color;g.lineWidth=width;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();}
function coastPalm(g,x,y){
  coastLine(g,COAST.woodDark,[[x,y+10],[x+2,y+2],[x,y-5]],2);
  coastPoly(g,COAST.forest,[[x,y-7],[x-8,y-6],[x-11,y-1],[x-3,y-3],[x-4,y+1],[x,y-3],[x+6,y+1],[x+4,y-4],[x+10,y-2],[x+6,y-7]]);
  coastRect(g,COAST.leaf,x-6,y-6,6,1);
}
function coastCoral(g,x,y){const R=(c,a,b,w,h)=>coastRect(g,c,a,b,w,h);R(COAST.red,x,y-4,3,10);R(COAST.red,x-4,y-1,4,3);R(COAST.red,x-5,y-5,2,6);R(COAST.red,x+2,y,5,2);R(COAST.red,x+5,y-3,2,4);R('#f6a6b6',x,y-4,1,6);}
function coastLighthouse(g,x,y,lit=true){
  coastPoly(g,COAST.ink,[[x-6,y+13],[x-4,y-8],[x+4,y-8],[x+7,y+13]]);
  coastPoly(g,COAST.paper,[[x-4,y+11],[x-2,y-7],[x+2,y-7],[x+5,y+11]]);
  coastRect(g,COAST.red,x-3,y+2,7,4);coastRect(g,COAST.ink,x-6,y-10,12,3);
  coastRect(g,lit?COAST.gold:COAST.rock,x-4,y-16,8,6);coastRect(g,COAST.ink,x-6,y-17,12,2);
  coastPoly(g,COAST.ink,[[x-7,y-18],[x,y-23],[x+7,y-18]]);
}
function coastSideShip(g,x,y,scale=1,lv={},enemy=false){
  g.save();g.translate(Math.round(x),Math.round(y));g.scale(scale,scale);
  const R=(c,a,b,w,h)=>coastRect(g,c,a,b,w,h),P=(c,p)=>coastPoly(g,c,p),L=(p,w=.7)=>coastLine(g,COAST.ink,p,w);
  const sail=enemy?'#303447':COAST.paper;
  P(COAST.ink,[[-34,-5],[-25,-3],[23,-3],[36,-8],[30,2],[23,9],[-23,9],[-30,3]]);
  P(COAST.wood,[[-30,-3],[-23,-1],[22,-1],[32,-5],[27,2],[22,6],[-22,6],[-27,2]]);
  R(COAST.woodLight,-24,0,48,2);R(COAST.woodDark,-23,5,45,2);
  for(let a=-16;a<24;a+=12){R(COAST.ink,a,2,5,3);R(COAST.gold,a+1,2,3,2);}
  R(COAST.ink,-25,-14,15,10);R(COAST.woodLight,-24,-13,13,9);R(COAST.ink,-26,-15,17,2);R(sail,-23,-17,11,3);
  R(COAST.ink,-21,-11,4,4);R(COAST.foam,-20,-10,2,2);
  R(COAST.ink,-3,-56,3,53);R(COAST.woodLight,-2,-54,1,49);R(COAST.ink,-18,-42,39,2);
  P(sail,[[-16,-40],[-3,-40],[-3,-10],[-14,-12],[-20,-17],[-18,-26]]);
  P(sail,[[1,-48],[5,-44],[13,-36],[20,-27],[22,-16],[1,-15]]);
  const shade=enemy?'#4f4c63':'#e1d4b6';
  P(shade,[[-16,-38],[-16,-21],[-13,-15],[-3,-12],[-3,-9],[-15,-11],[-20,-16],[-18,-30]]);
  P(shade,[[2,-17],[20,-19],[22,-16],[1,-14],[1,-44],[3,-42]]);
  L([[-3,-52],[-31,-5]]);L([[0,-51],[31,-6]]);
  if(enemy){R(COAST.paper,8,-33,7,6);R(COAST.ink,9,-31,2,2);R(COAST.ink,13,-31,2,2);R(COAST.paper,10,-27,3,2);}
  else{R(COAST.gold,8,-32,7,7);R(COAST.ink,13,-31,1,2);R(COAST.red,15,-29,3,2);}
  P(COAST.red,[[-2,-56],[12,-54],[7,-51],[-2,-52]]);
  if(lv.sails){P(sail,[[-18,-44],[-3,-44],[-3,-53],[-13,-51]]);R(COAST.ink,-19,-44,17,1);}
  if(lv.hull){R(COAST.gold,-23,6,45,1);R(COAST.ink,-28,-2,5,5);R(COAST.ink,24,-3,4,5);}
  if(lv.cannon){R(COAST.ink,14,-7,14,4);R(COAST.rock,15,-7,10,2);R(COAST.ink,16,-3,4,2);}
  g.restore();
}
function coastTopShip(g,x,y,scale=1,lv={}){
  g.save();g.translate(Math.round(x),Math.round(y));g.scale(scale,scale);
  const R=(c,a,b,w,h)=>coastRect(g,c,a,b,w,h),P=(c,p)=>coastPoly(g,c,p);
  P(COAST.ink,[[-10,-26],[9,-26],[15,-19],[14,13],[9,23],[0,32],[-9,23],[-14,12],[-14,-17]]);
  P(COAST.woodLight,[[-9,-23],[8,-23],[12,-18],[11,12],[6,22],[0,28],[-6,22],[-11,12],[-11,-17]]);
  for(let j=-18;j<24;j+=5)R(COAST.wood,j>12?-6:-10,j,j>12?12:21,1);
  R(COAST.woodDark,-8,-21,16,10);R(COAST.paper,-6,-20,12,3);R(COAST.ink,-2,-15,5,4);R(COAST.foam,-1,-14,3,2);
  R(COAST.ink,-2,-12,3,30);coastLine(g,COAST.ink,[[-11,-12],[10,14]],.7);coastLine(g,COAST.ink,[[11,-12],[-10,15]],.7);
  P(COAST.paper,[[-17,-5],[0,-9],[16,-4],[12,3],[1,8],[-12,3]]);P('#e1d4b6',[[-14,0],[1,4],[13,0],[12,3],[1,8],[-12,3]]);
  R(COAST.gold,-3,-2,6,5);R(COAST.red,0,-18,11,3);R(COAST.ink,0,-21,1,13);R(COAST.ink,-1,16,3,4);
  if(lv.sails){P(COAST.paper,[[-12,-12],[0,-15],[11,-12],[1,-9]]);}
  if(lv.hull){R(COAST.gold,-10,9,2,7);R(COAST.gold,9,9,2,7);}
  if(lv.cannon){R(COAST.ink,10,12,10,4);R(COAST.rock,12,12,7,2);}
  g.restore();
}
const COAST_SHIPS=new Map();
function coastalShipSprite(lv={},top=false){
  const bits=(lv.sails?1:0)|(lv.hull?2:0)|(lv.cannon?4:0),key=bits+(top?8:0);
  if(!COAST_SHIPS.has(key))COAST_SHIPS.set(key,top?mk(44,66,g=>coastTopShip(g,20,28,1,lv)):mk(76,68,g=>coastSideShip(g,37,57,1,lv)));
  return COAST_SHIPS.get(key);
}
const COAST_SHAPES={
  cove:[[-23,-10],[-13,-19],[5,-20],[20,-13],[25,-4],[20,4],[9,1],[4,-5],[-4,-5],[-9,2],[-5,11],[7,12],[13,18],[-1,22],[-18,16],[-27,4]],
  reef:[[-26,-3],[-21,-14],[-7,-21],[11,-20],[25,-10],[28,4],[17,17],[0,22],[-19,15],[-28,5]],
  volcano:[[-25,7],[-22,-6],[-14,-14],[-4,-19],[7,-17],[12,-8],[23,-5],[27,9],[16,17],[0,20],[-17,17]],
  lighthouse:[[-14,-16],[-4,-23],[7,-19],[10,-7],[17,0],[12,8],[15,15],[3,22],[-8,17],[-9,6],[-17,-3]],
  harbor:[[-29,-23],[24,-23],[28,-11],[14,-5],[7,4],[-4,8],[-7,24],[-29,24]]
};
function coastInside(x,y,p){let v=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [a,b]=p[i],[c,d]=p[j];if(((b>y)!==(d>y))&&(x<(c-a)*(y-b)/(d-b)+a))v=!v;}return v;}
const COAST_ISLANDS=new Map();
function coastalIslandSprite(id,lit=false){
  const key=id+(lit?'lit':'');if(COAST_ISLANDS.has(key))return COAST_ISLANDS.get(key);
  const sprite=mk(76,76,g=>{
    if(id==='fortress'){coastSideShip(g,37,57,.85,{sails:1,hull:1,cannon:1},true);return;}
    const a=38,b=41,p=COAST_SHAPES[id]||COAST_SHAPES.cove;
    const land=(x,y)=>coastInside(x-a,y-b,p)&&(id!=='reef'||Math.hypot((x-a)/14,(y-b)/10)>1);
    for(let y=10;y<72;y+=2)for(let x=4;x<72;x+=2)if(land(x,y)||[[-5,0],[5,0],[0,-5],[0,5]].some(([i,j])=>land(x+i,y+j)))coastRect(g,COAST.shallow,x,y,2,2);
    for(let y=10;y<72;y+=2)for(let x=4;x<72;x+=2)if(land(x,y))coastRect(g,id==='volcano'?'#443a4c':COAST.rock,x,y+4,2,2);
    for(let y=10;y<72;y+=2)for(let x=4;x<72;x+=2){if(!land(x,y))continue;
      const edge=[[-2,0],[2,0],[0,-2],[0,2]].some(([i,j])=>!land(x+i,y+j));
      const c=id==='volcano'?(edge?'#524654':'#74606b'):id==='lighthouse'?(edge?COAST.rock:COAST.rockLight):(edge?COAST.sandShadow:COAST.sand);
      coastRect(g,c,x,y,2,2);if(edge&&!land(x,y+3)&&(x+y)%8===0)coastRect(g,COAST.foam,x,y+6,3,1);
    }
    if(id==='cove'){coastPalm(g,a-15,b);coastPalm(g,a+3,b-12);coastRect(g,COAST.woodDark,a-18,b+8,12,4);coastRect(g,COAST.woodLight,a-18,b+8,12,1);}
    if(id==='reef'){coastCoral(g,a-18,b);coastCoral(g,a+13,b-9);coastCoral(g,a+15,b+9);}
    if(id==='volcano'){coastPoly(g,'#393749',[[a-16,b+5],[a-5,b-17],[a+5,b-18],[a+18,b+6]]);coastPoly(g,COAST.red,[[a-6,b-16],[a+5,b-17],[a+8,b-11],[a+1,b-11],[a-1,b],[a-5,b+3],[a-3,b-10],[a-8,b-10]]);coastRect(g,COAST.gold,a-4,b-16,7,2);coastRect(g,'#8c778b',a-6,b-25,7,3);}
    if(id==='lighthouse')coastLighthouse(g,a,b-2,lit);
    if(id==='harbor'){coastRect(g,COAST.woodDark,a+2,b+4,18,5);for(let i=3;i<20;i+=4)coastRect(g,COAST.woodLight,a+i,b+4,2,4);coastRect(g,COAST.red,a-18,b-16,12,5);coastRect(g,COAST.paper,a-17,b-11,10,10);}
  });COAST_ISLANDS.set(key,sprite);return sprite;
}

/* ===== src/engine/city_art.js ===== */
/* Shared native pixel art for the city's buildings, terrace and public spaces. */

function groundFor(c,r,h){
  const coastal=regionOfPos(c*16+8,r*16+8);
  if(coastal&&coastal.id==='volcano')return TILE.basalt[h%2];
  if(coastal&&coastal.id==='lighthouse')return TILE.coastStone[h%2];
  switch(groundOf(c,r)){
    case 'snow':return TILE.snow[h%2];
    case 'cobble':return TILE.cobble;
    case 'sand':return TILE.sand[h%2];
  }
  return TILE.grass[h%3];

/* ===== src/world/regions.js ===== */
/* ---------------- regions ----------------
   Every area of the game is a REGION: a grid of 16x12-tile screens with its own tiles, kind and name.
   Regions are defined in src/regions/*.js with defineRegion({...}) and stitched into one tile grid by
   buildWorld(). To add an area: create a region file, add it to src/order.json (before world/tilemap.js),
   give it an origin on free screen coordinates. Nothing else needs to know the global grid size.

   defineRegion fields
     id        unique id (also used by the save: Pip's position is {region,x,y} local to the region)
     name      HUD label          kind      'outdoor' | 'indoor' | 'cave'   (weather / darkness / music)
     origin    [sx,sy] top-left screen in the shared tile grid      grid [w,h] screens across/down
     screens   w*h screens, row-major, each an array of 12 strings of 16 tiles
     ground    'grass'|'snow'|'sand'|'cobble' (what shows under transparent tiles)   beyond: true for Part 2 areas
     kinds     optional per-screen kind override   labels: optional per-screen names (rooms, secrets)
     area      key used by the fly map / area discovery (defaults to none)                                  */
const REGIONS={},REGION_LIST=[],CELL={},WALK=new Set(),ROAM=new Set();   // WALK = outdoor screens, ROAM = screens you can walk between (outdoor + roam regions like caves)
let MW=0,MH=0,MAP=[];
const AREA_IDS=['farm','mountains','coop','forest','city','beach'];
function defineRegion(d){REGIONS[d.id]=d;REGION_LIST.push(d);}
// map-making helpers for region files. grid(fill, ops): ['r',c0,r0,c1,r1,ch] fills a rectangle, ['p',c,r,ch] sets one tile.
function grid(fill,ops=[],w=16,h=12){
  const g=[...Array(h)].map(()=>Array(w).fill(fill));
  for(const o of ops){if(o[0]==='r'){for(let r=o[2];r<=o[4];r++)for(let c=o[1];c<=o[3];c++)g[r][c]=o[5];}else g[o[2]][o[1]]=o[3];}
  return g.map(r=>r.join(''));
}
// a one-screen room: walls on top and bottom, windows, an exit at the bottom; floor spans cols 2-13, rows 3-10
function room(ops=[],floor='_'){
  const base=['################','################','##i###i##i###i##',...Array(8).fill('##'+floor.repeat(12)+'##'),'#######XX#######'];
  return grid('#',[['r',0,0,15,11,'#'],...base.flatMap((row,r)=>[...row].map((ch,c)=>['p',c,r,ch])),...ops]);
}
function buildWorld(){
  let maxX=0,maxY=0;
  for(const r of REGION_LIST){
    r.area=r.area||(AREA_IDS.includes(r.id)?r.id:null);r.cells=[];
    for(let gy=0;gy<r.grid[1];gy++)for(let gx=0;gx<r.grid[0];gx++){
      const i=gy*r.grid[0]+gx,cx=r.origin[0]+gx,cy=r.origin[1]+gy;
      if(CELL[cx+','+cy])console.warn('region overlap at',cx,cy,r.id);
      const sc=r.screens[i];if(!sc)continue;const meta=Array.isArray(sc)?{}:sc;
      const cell={region:r,sx:cx,sy:cy,gx,gy,i,rows:Array.isArray(sc)?sc:sc.rows,meta,id:meta.id,kind:meta.kind||(r.kinds&&r.kinds[i])||r.kind,label:meta.label||(r.labels&&r.labels[i])};
      CELL[cx+','+cy]=cell;r.cells.push(cell);maxX=Math.max(maxX,cx);maxY=Math.max(maxY,cy);
      if(cell.kind==='outdoor')WALK.add(cx+','+cy);
      if(cell.kind==='outdoor'||r.roam)ROAM.add(cx+','+cy);
    }
  }
  MW=(maxX+1)*16;MH=(maxY+1)*12;MAP=[];
  for(let sy=0;sy<=maxY;sy++)for(let r=0;r<12;r++){
    let row='';
    for(let sx=0;sx<=maxX;sx++){const c=CELL[sx+','+sy];row+=c?c.rows[r]:'TTTTTTTTTTTTTTTT';}
    MAP.push(row);
  }
}
function cellAt(cs=CS){return CELL[cs.x+','+cs.y]||null;}
function regionAt(cs=CS){const c=cellAt(cs);return c?c.region:null;}
function regionOfPos(x,y){return regionAt({x:Math.floor(x/256),y:Math.floor((y-1)/192)});}
function inBeyond(x=P.x,y=P.y){const r=regionOfPos(x,y);return !!r&&r.beyond;}
function groundOf(c,r){const g=regionOfPos(c*16+8,r*16+8);return g?g.ground:'grass';}
// saves store position as {region,x,y} relative to the region's top-left corner
function toRegionPos(x,y){const r=regionOfPos(x,y)||REGIONS.farm;return {region:r.id,x:Math.round(x-r.origin[0]*256),y:Math.round(y-r.origin[1]*192)};}
function fromRegionPos(p){const r=REGIONS[p.region]||REGIONS.farm;return {x:p.x+r.origin[0]*256,y:p.y+r.origin[1]*192};}

// b/B/D barn roof/wall/door  v/c/K coop roof/wall/door  s sign  u bush  . grass  , flowers
// d dirt  p worm patch  m mud  r reeds
defineRegion({id:'farm',name:'FARM',kind:'outdoor',origin:[0,0],grid:[3,2],ground:'grass',beyond:false,
 screens:[
 [ // coop
  'FFFFFFFFFFFFFFFF',

  }return g.map(row=>row.join(''));
}

function solidTile(ch,forPlayer=true){

function drawTile(ch,c,r,sx,sy,wf){
  const h=hash2(c,r);let img;
  const region=regionOfPos(c*16+8,r*16+8);
  if(region&&drawCityRoomTile(c,r,sx,sy,region))return;
  if(region&&region.id==='city'&&drawCityTile(ch,c,r,sx,sy))return;
  if(region&&region.area==='village'&&drawVillageTile(ch,c,r,sx,sy,wf))return;
  if(region&&((region.sea&&region.kind==='outdoor')||(region.id==='city'&&c>=64&&r>=72))&&drawCoastalTile(ch,c,r,sx,sy,region))return;
  switch(ch){
    case '.':img=TILE.grass[h%3];break;
    case ',':img=TILE.flower[h%2];break;
    case 'd':img=TILE.dirt;break;
    case 'p':img=TILE.patch;break;
    case 'm':img=TILE.mud;break;
    case 'r':img=TILE.reeds;break;
    case 'W':{ctx.drawImage(TILE.water[(wf+(c+r)%2)%2],sx,sy);ctx.fillStyle=PAL.c;
      if(tileAt(c,r-1)!=='W')ctx.fillRect(sx,sy,16,1);
      if(tileAt(c,r+1)!=='W'){ctx.fillRect(sx,sy+15,16,1);}
      if(tileAt(c-1,r)!=='W')ctx.fillRect(sx,sy,1,16);
      if(tileAt(c+1,r)!=='W')ctx.fillRect(sx+15,sy,1,16);
      return;}
    case 'F':{const v=(tileAt(c,r-1)==='F'||tileAt(c,r+1)==='F')&&tileAt(c-1,r)!=='F'&&tileAt(c+1,r)!=='F';img=v?TILE.fenceV:TILE.fenceH;break;}
    case 'H':img=TILE.tall;break;
    case 'T':img=TILE.tree;break;
    case 'A':img=G.picked[c+','+r]?TILE.tree:TILE.apple;break;
    case 'h':img=TILE.hay;break;
    case 'R':img=TILE.rock;break;
    case 'C':img=TILE.crate;break;
    case 'L':img=TILE.leaves;break;
    case 's':if(inBeyond(c*16+8,r*16+8)){ctx.drawImage(groundFor(c,r,h),sx,sy);img=TILE.signO;}else img=TILE.sign;break;
    case 'u':img=TILE.bush;break;
    case 'b':img=TILE.roof;break;
    case 'B':img=TILE.barn;break;
    case 'D':img=TILE.door;break;
    case 'v':img=(G.coop&&G.coop.lv>=4&&r>=48&&inSite(c,r))?TILE.goldroof:TILE.croof;break;
    case 'c':img=TILE.cwall;break;
    case 'K':img=TILE.cdoor;break;
    case 'j':img=TILE.hroof;break;
    case 'J':img=TILE.hwall;break;
    case 'I':img=TILE.hwin;break;
    case 'O':img=TILE.hdoor;break;
    case 'V':img=TILE.garden;break;
    case '#':img=FLOORISH.has(tileAt(c,r+1))||'ktenfyS'.includes(tileAt(c,r+1))?TILE.wface:TILE.wtop;break;
    case 'i':img=TILE.wwin;break;
    case '_':img=TILE.floor;break;
    case ':':img=TILE.straw;break;
    case 'n':img=TILE.nest;break;
    case 'X':img=(r>=36&&r<48)?(c<16?TILE.exitCave:TILE.exitStone):TILE.exit;break;
    case 'g':img=TILE.snow[h%2];break;
    case '~':img=TILE.sand[h%2];break;
    case '=':img=TILE.cobble;break;
    case 'N':img=TILE.cliff;break;
    case 'E':img=TILE.pine;break;
    case 'M':img=TILE.boulder;break;
    case 'q':img=G.picked[c+','+r]?TILE.tree:TILE.oak;break;
    case '2':img=TILE.palm;break;
    case '(':img=TILE.brock;break;
    case '3':img=TILE.planks;break;
    case 'x':img=TILE.dam[wf];break;
    case 'a':img=TILE.roofC;break;
    case '1':img=TILE.brickDoor;break;
    case 'α':img=TILE.cloud[h%3];break;
    case 'γ':ctx.drawImage(TILE.openSky,sx,sy);img=TILE.thinCloud;break;
    case 'ε':img=TILE.windR[Math.floor(tick/6)%4];break;
    case 'ζ':img=TILE.windL[Math.floor(tick/6)%4];break;
    case 'η':img=TILE.openSky;break;
    case 'θ':img=TILE.stormCrystal;break;
    case 'ι':img=TILE.rainWall[Math.floor(tick/5)%2];break;
    case 'κ':img=TILE.barrier;break;
    case ')':img=TILE.coral;break;
    case ']':img=TILE.seaweed;break;
    case '<':img=TILE.curL[Math.floor(tick/8)%4];break;
    case '>':img=TILE.curR[Math.floor(tick/8)%4];break;
    case '{':img=TILE.lava[Math.floor(tick/20+c+r)%2];break;
    case '}':img=TILE.spring[Math.floor(tick/24+c)%2];break;
    case '"':img=TILE.obsidian;break;
    case '`':img=TILE.deck;break;
    case '\\':img=TILE.wreck;break;
    case '/':img=TILE.wreckDeck;break;
    case '7':{const pad=PADS.find(p=>c>=p.c&&c<p.c+2&&r>=p.r&&r<p.r+2);
      img=pad&&G.vil.b[pad.id]&&G.vil.b[pad.id].done?groundFor(c,r,h):TILE.pad;break;}
    case '5':img=TILE.ship;break;
    case '6':img=TILE.stackCrate;break;
    case '8':img=TILE.roofWalk;break;
    case '9':img=TILE.shelf;break;
    case '4':img=TILE.pedestal;break;
    case 'U':img=TILE.brick;break;
    case 'Q':{ctx.drawImage(TILE.brickWin,sx,sy);if(nightAmt()>0.35){ctx.fillStyle='#ffd870';ctx.fillRect(sx+4,sy+4,3,3);ctx.fillRect(sx+8,sy+4,4,3);ctx.fillRect(sx+4,sy+8,3,4);ctx.fillRect(sx+8,sy+8,4,4);}return;}
    case 'l':img=TILE.awning;break;
    case '|':img=TILE.lamp;break;
    case '[':img=TILE.bench;break;
    case 'z':{ctx.drawImage(TILE.chasm,sx,sy);if(tileAt(c,r-1)!=='z'){ctx.fillStyle=PAL.E;ctx.fillRect(sx,sy,16,3);ctx.fillStyle='#e8f0f8';ctx.fillRect(sx,sy,16,1);}
      if(tileAt(c-1,r)!=='z'){ctx.fillStyle='#2a2238';ctx.fillRect(sx,sy,2,16);}if(tileAt(c+1,r)!=='z'){ctx.fillStyle='#2a2238';ctx.fillRect(sx+14,sy,2,16);}return;}
    case 'w':{ctx.drawImage(TILE.deep[(wf+(c+r)%2)%2],sx,sy);ctx.fillStyle='#6aa0e8';
      if(!'wx'.includes(tileAt(c,r-1)))ctx.fillRect(sx,sy,16,2);if(!'wx'.includes(tileAt(c-1,r)))ctx.fillRect(sx,sy,2,16);if(!'wx'.includes(tileAt(c+1,r)))ctx.fillRect(sx+14,sy,2,16);return;}
    case '$':{ctx.drawImage(TILE.cobble,sx,sy);ctx.fillStyle=PAL.k;ctx.fillRect(sx,sy,16,16);ctx.fillStyle=PAL.e;ctx.fillRect(sx,sy,16,16);
      ctx.fillStyle=PAL.u;const L=tileAt(c-1,r)!=='$',R=tileAt(c+1,r)!=='$',T=tileAt(c,r-1)!=='$',B=tileAt(c,r+1)!=='$';
      ctx.fillRect(sx+(L?3:0),sy+(T?3:0),16-(L?3:0)-(R?3:0),16-(T?3:0)-(B?3:0));ctx.fillStyle=PAL.c;const sp=Math.floor(tick/8)%3;
      if(!R&&!B){ctx.fillStyle=PAL.e;ctx.fillRect(sx+12,sy+12,4,4);ctx.fillStyle=PAL.c;ctx.fillRect(sx+13,sy+8-sp,2,4+sp);ctx.fillRect(sx+11+sp,sy+10,1,1);}
      else{ctx.fillRect(sx+4+((tick/10+c*5)%8|0),sy+6+(r%2)*4,3,1);}return;}
    case '!':{const h2=hash2(c,r);ctx.drawImage(groundFor(c,r,h2),sx,sy);ctx.fillStyle=PAL.T;
      if(tileAt(c,r-1)!=='!')ctx.fillRect(sx,sy+2,16,1);if(tileAt(c,r+1)!=='!')ctx.fillRect(sx,sy+13,16,1);
      if(tileAt(c-1,r)!=='!')ctx.fillRect(sx+2,sy,1,16);if(tileAt(c+1,r)!=='!')ctx.fillRect(sx+13,sy,1,16);
      ctx.fillStyle=PAL.B;if(tileAt(c-1,r)!=='!'&&tileAt(c,r-1)!=='!')ctx.fillRect(sx+1,sy,3,5);if(tileAt(c+1,r)!=='!'&&tileAt(c,r+1)!=='!')ctx.fillRect(sx+12,sy+11,3,5);return;}
    case '%':img='-X'.includes(tileAt(c,r+1))?TILE.caveFace:TILE.caveWall;break;
    case '-':img=TILE.caveFloor;break;
    case '&':img=';+0GX'.includes(tileAt(c,r+1))?TILE.stoneFace:TILE.stoneTop;break;
    case ';':img=TILE.stoneFloor;break;
    case '+':img=TILE.plate;break;
    case 'G':img=TILE.gate;break;
    case '0':img=TILE.barrel;break;
    case 'Z':img=TILE.crack;break;
    case 'Y':img=TILE.trap;break;
    case '^':img=TILE.hole;break;
    case '*':{ctx.drawImage(TILE.shroom,sx,sy);if(nightAmt()>0.3){const g=Math.floor(tick/20+c)%2;ctx.fillStyle=g?'#7ff0ff':'#b8fff4';
      [[4,9],[10,6],[11,12]].forEach(([i,j])=>ctx.fillRect(sx+i-1,sy+j-1,3,2));}return;}
    case '@':{ctx.drawImage(TILE.ring,sx,sy);if(nightAmt()>0.3){ctx.fillStyle=Math.floor(tick/12)%2?'#ff9cf0':'#d890ff';
      for(let a=0;a<8;a++){const i=Math.round(8+Math.cos(a*0.785+tick/40)*6),j=Math.round(8+Math.sin(a*0.785+tick/40)*5);ctx.fillRect(sx+i,sy+j,1,1);}}return;}
    case 'y':img=TILE.hayIn;break;
    case 'S':{const v=(tileAt(c,r-1)==='S'||tileAt(c,r+1)==='S')&&tileAt(c-1,r)!=='S'&&tileAt(c+1,r)!=='S';img=v?TILE.railV:TILE.railH;break;}
    case 'k':img=TILE.counter;break;
    case 't':img=TILE.table;break;
    case 'e':img=tileAt(c,r-1)==='e'?TILE.bedlow:TILE.bedtop;break;
    case 'P':img=TILE.plant;break;
    case 'o':{ctx.drawImage(TILE.rug,sx,sy);ctx.fillStyle=PAL.R;
      if(tileAt(c,r-1)!=='o')ctx.fillRect(sx,sy,16,2);if(tileAt(c,r+1)!=='o')ctx.fillRect(sx,sy+14,16,2);
      if(tileAt(c-1,r)!=='o')ctx.fillRect(sx,sy,2,16);if(tileAt(c+1,r)!=='o')ctx.fillRect(sx+14,sy,2,16);return;}
    case 'f':{ctx.drawImage(TILE.hearth,sx,sy);const fl=Math.floor(tick/6)%3;
      ctx.fillStyle=PAL.o;ctx.fillRect(sx+4,sy+10-fl,8,6+fl);ctx.fillStyle=PAL.y;ctx.fillRect(sx+6,sy+12-((fl+1)%3),4,4);
      ctx.fillStyle=PAL.w;ctx.fillRect(sx+7,sy+14,2,2);ctx.fillStyle=PAL.B;ctx.fillRect(sx+3,sy+15,10,1);return;}
    default:img=TILE.grass[0];
  }
  ctx.drawImage(img,sx,sy);
}

function migrateSeeds(s){
  if(s.sp1!==undefined){G.sp1=s.sp1;G.sp2=s.sp2||0;G.earned=s.earned||0;return;}
  const f=s.found||0;G.sp1=Math.min(TOTAL_SEEDS,f);G.sp2=G.part2?Math.min(TOTAL_SEEDS2,Math.max(0,f-TOTAL_SEEDS)):0;G.earned=f;
}
function addSeeds(n,part,base){G.seeds+=n;G.earned+=n;if(base===undefined)base=n;
  if(part===2)G.sp2=Math.min(TOTAL_SEEDS2,G.sp2+base);else G.sp1=Math.min(TOTAL_SEEDS,G.sp1+base);}
function migrateSave(s){
  if(!s.ov){G.outfits=[...new Set(G.outfits.map(id=>OUTFIT_RENAME[id]||id))];if(G.wear)G.wear=OUTFIT_RENAME[G.wear]||G.wear;}
  if(G.coop&&OLD_SITES[G.coop.site]){const o=OLD_SITES[G.coop.site];
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<3;dx++){const k=(o.c+dx)+','+(o.r+dy);delete G.mods[k];tiles[o.r+dy][o.c+dx]=MAP[o.r+dy][o.c+dx];}
    for(const [c,r] of o.plots){const k=c+','+r;delete G.mods[k];tiles[r][c]=MAP[r][c];delete G.plots['plot_'+c+'_'+r];}
    G.coop.site='forest';G.coop.fresh=true;}
}

// next thing to do in the village (hint system)
function villageHint(){
  if(!G.vil.open)return null;
  if(G.vil.letters.length)return QUESTS['v_'+G.vil.letters[0]].hint();
  if(G.q.vfound===1&&!builtList().length)return QUESTS.vfound.hint();
  for(const r of RESIDENTS)if(G.q['v_'+r.id]===0)return QUESTS['v_'+r.id].hint();
  if(!G.flags.village)return happiness()>=FINALE_HAPPY?"The village is happy! Talk to Foreman Barnaby for the Grand Harvest Festival!":QUESTS.vharvest.hint();
  return null;
}

/* ===== src/content/dialogue.js ===== */
/* content: what the characters with special conversations say.
   Each TALK entry is (e,{it,me,ask})=>... : it(text,fx) = they speak, me(text) = Pip speaks, ask(text,choices,cb) = a choice.
   Return false to fall through to the character's quest dialogue. Quest lines live in quests_farm/quests_beyond. */
const TALK={
granny:(e,{it,me,ask})=>{
  if(G.q.granny!==2||G.flags.festival)return false;
  if(festivalReady()){
    it("Pip, dearie... look how much you've grown!");
    it("I've waited 112 years to see a chick like you. It's time for the COMING-OF-AGE FESTIVAL!");
    ask('Are you ready?',['Ready!','Not yet'],i=>{if(i===0)startFestival();});return;}
  if(allP2Done()&&G.coop&&G.coop.lv>=4){
    it("Your dream coop is lovely, dearie! But you're not quite full-grown yet.");
    it("Keep growing: help friends, find secrets, tend your garden, and munch seeds at the snack bowl!");return;}
  return false;
},
penny:(e,{it,me,ask})=>{
  if(G.q.penny!==2)return false;
    ask(G.outfits.includes('bow')?"Egg Catch again? Your best is "+G.best.egg+" eggs!":"Wanna play EGG CATCH? Catch 20 eggs in your basket, and don't let 5 crack! Win, and I'll give you my spare PINK BOW!",
      ["Let's play!","Later"],i=>{if(i===0)startEgg();});
},
maggie:(e,{it,me,ask})=>{
    if(!e.greeted){e.greeted=1;it("Ooh! Shiny! A customer! Welcome to my NEW boutique on Main Street, darling!");}
    ask("Care to try something on? Every chick deserves to look FABULOUS.",['Shop','Bye!'],i=>{if(i===0)openCatalog('boutique');});
},
bunbun:(e,{it,me,ask})=>{
    if(!G.met.has('bunbun_hi')){G.met.add('bunbun_hi');it("Whoa! You found my secret burrow! Nobody EVER finds it!");it("I'm Bun-Bun! I love carrots more than anything in the whole world!");}
    ask("Wanna play CARROT BONK? Carrots pop out of the holes. Peck 12 before time runs out!"+(G.outfits.includes('ears')?" (Best: "+G.best.bonk+")":" Win, and you get my spare BUNNY EARS!"),
      ['Play!','Not now'],i=>{if(i===0)startMG('bonk','bunbun');});
},
hootie:(e,{it,me,ask})=>{
    if(nightAmt()<0.3){it("Hoo... *yawn*... it's far too bright. Come back when the moon is up, little one.");return true;}
    if(!G.met.has('hootie_hi')){G.met.add('hootie_hi');it("Hoo-hoo! Welcome to the Moonlit Grove. Very few chicks have ever seen it.");}
    ask("Care for a game of FIREFLY CATCH? Peck 15 fireflies before the moon goes down!"+(G.outfits.includes('pirate')?" (Best: "+G.best.ffly+")":" Win, and a PIRATE OUTFIT is yours."),
      ['Play!','Not now'],i=>{if(i===0)startMG('ffly','hootie');});
},
nibbles:(e,{it,me,ask})=>{
    if(G.items.letter){
      it("Bonjour! A letter from cousin Squeaks? How delightful!");
      it("*read read* ...Oh ho ho! Let me write back right away.");
      it("Please bring Squeaks my letter, and this fresh cheese! Merci, little chick!",()=>{G.items.letter=0;G.items.cheese=1;tasteFood('cheese');toast('Got cheese for Squeaks!');SFX.pick();save();});
    }else if(G.items.cheese)it("Hurry, hurry! Bring that cheese to Squeaks in the barn before I eat it myself!");
    else{it(G.q.squeaks===2?"Squeaks says thank you! You are a very fine mail carrier.":"Bonjour! I am Nibbles, chef of this kitchen. Mind the crumbs, s'il vous plait!");
      if(!G.cellar)it("Psst... One of the floorboards near the bedroom creaks. I think something is hidden underneath!");}
},
mom:(e,{it,me,ask})=>{
    if(G.q.mom===0){
      it("Good morning, Pip, my little peep! Did you sleep well?");
      me("Mama! I want to FLY! Over the Big Fence, to see the whole wide world!");
      it("Fly?! Oh, my feathers... You're just a teeny tiny chick!");
      it("To fly, you'll need to grow big and strong. And growing chicks need SEEDS.");
      it("The animals on the farm will share their seeds if you help them out.");
      it("But first, breakfast! Peck up 3 wiggly worms from the dirt patches.",()=>{G.q.mom=1;});
      it("Walk with the ARROW KEYS. Press Z or SPACE to peck!");
    }else if(G.q.mom===1){
      if(G.items.worm>=3){
        it("Yum! What a good little pecker you are!");
        it("Here, take 4 seeds, sweet pea.",()=>reward(4,'mom'));
        it("Press E to open your GROWTH TREE. Spend seeds there to learn skills and grow big and strong!");
        it("Then go help the other animals. Daisy the cow lives in the barnyard, and Clyde the horse is inside the big red barn.");
        it("Oh, and your big sister Penny is inside our coop. You can walk right in through the little door!");
      }else it("Find the wiggly worms in the dirt patches and peck them! ("+G.items.worm+"/3)");
    }else{
      it("*cuddle* There you go, all your hearts are full!",()=>{G.hearts=maxHearts();SFX.pick();});
      if(nightAmt()>0.4&&Math.random()<0.5)it("Isn't the night pretty? They say a fairy ring by our coop glows when the moon is out... And you can sleep in your nest inside the coop.");
      else it(hint());
    }
},
};

const shopOutfit=(id)=>{const o=OUTFITS.find(x=>x.id===id),own=G.outfits.includes(id);
  return {name:o.name,price:own?null:priceOf(o),tag:own?(wearing(id)?'ON':'OWN'):null,own,on:wearing(id),desc:o.desc,bonus:o.bonus,outfit:id,

/* ---- talk ---- */
const trainPending=k=>{const t=TRAIN[k];return !!t&&t.avail()&&(G.train[k]||0)!==2&&!has(k);};
Object.assign(TALK,{
  elda:(e,{it,me,ask})=>{
    if(!G.flags.skyMap||G.q.elda!==2)return false;
    if(!G.sky.hatched){
      if(!G.q.sk_hatch)G.q.sk_hatch=1;
      it("Screeee! Pip! Come quickly! Look at the egg!");
      it("It's wobbling! The egg you saved is about to HATCH!");
      it("And that old map the pirates gave you? It shows a stairway in the clouds, right here on the peak. Our little one is meant to follow it with you.");
      ask("Will you watch the hatching with me?",['Yes!','Not yet'],i=>{if(i===0)startHatch();});return true;}
    if(!G.sky.open){it("Screee! The cloud stairway is just east of my nest, Pip. Take our little one up there!");return true;}
    it(G.flags.sky?"Screee! The skies are calm again, and my chick is so happy up there with you!":"Screee! I can see the storm over the peaks from here. Be careful, you two!");return true;},
  hatch:(e,{it,ask})=>{
    if(trainPending('divebomb'))return false;
    const n=G.sky.name||'CHICK';
    it(['*peep peep!*','*flap flap!* (It wants you to jump on the bouncy clouds!)','*peep?* (It looks up at the sky, then at you.)','*chirp!*'][(Math.random()*4)|0]);
    if(has('divebomb'))it("(Your chick did a tiny, proud dive-bomb into the cloud.)");},
  nb1:(e,{it})=>{it(['Peep!','Peep peep!','*flap flap*'][(Math.random()*3)|0]);},
  nb2:(e,{it})=>{it(['*sleepy peep*','Skree!','*waddles in a tiny circle*'][(Math.random()*3)|0]);},
  plume:(e,{it,ask})=>{
    if(G.q.sk_boutique!==2)return false;
    it("Coo! Lovely to see you, darling. The window looks divine!");
    ask("Care to try something on?",['Shop','Bye!'],i=>{if(i===0)openCatalog('plume');});},
  starla:(e,{it,ask})=>{
    if(trainPending('thunder')&&((G.train.thunder||0)===0||trainCount('thunder')>=TRAIN.thunder.need))return false;
    if(trainPending('thunder'))it(TRAIN.thunder.remind());
    if(!G.met.has('starla_hi')){G.met.add('starla_hi');it("Hoo! Welcome to the Star-Fruit Stand! I'm Starla. Fruit that glows in the dark!");}
    ask("Fancy a snack, or a seed to grow your own?",['Shop','Bye!'],i=>{if(i===0)openCatalog('starstand');});},
  nimbus:(e,{it,ask})=>{
    if(G.q.sk_rods!==2||(G.q.sk_boss!==2&&FOLLOW_GATE.sk_boss()))return false;
    it(G.flags.sky?"Hmph. The sky is clear. I'm almost bored.":"Hmph. Weather's weather.");
    ask("Anything for the weather?",['Shop','Bye!'],i=>{if(i===0)openCatalog('weather');});},
  tweeta:(e,{it})=>{if(G.q.sk_cake!==2)return false;it(['Tweet! The cake was delicious. Thank you!','Tweet tweet! Happy hatching-day to me!','Tweet! Have you met the babies in the nursery?'][(Math.random()*3)|0]);},
  puff:(e,{it})=>{if(G.q.sk_lambs!==2)return false;it(['Baaa. Everything is soft up here.','Baaa! The lambs say hello!','Baaa. Mind the thin clouds, dear.'][(Math.random()*3)|0]);},
  stormy:(e,{it,ask})=>{
    it(['*rumble* ...Hello, little friend.','*gentle rumble* I was so lonely. Not any more.','*puffs a tiny cloud heart*'][(Math.random()*3)|0]);}
});

/* procedural chick: grows with each stage */
const chickCache=new Map();
function chickSprite(stage,dir,frame,flap,gold=false){
  const WC=gold?'q':'Y',key=stage+'|'+dir+'|'+frame+'|'+flap+'|'+gold;let s=chickCache.get(key);if(s)return s;
  const side=dir===2,S=12+stage*2,Wd=S+(flap?10:0),Hd=S+1;
  const g=[...Array(Hd)].map(()=>Array(Wd).fill('.'));
  const put=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<Wd&&y<Hd)g[y][x]=c;};
  const ell=(cx,cy,rx,ry,c)=>{for(let y=0;y<Hd;y++)for(let x=0;x<Wd;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)g[y][x]=c;}};
  const cx=Wd/2,foot=Hd-1,ry=S*0.27,rx=S*0.36,by=foot-ry-0.3,hr=S*(0.30-stage*0.014);
  let hx=cx,hy=by-ry*0.55-hr*0.6;if(side)hx=cx-S*0.12;
  if(!flap){
    if(side){const a=frame?1:0;put(cx-1-a,foot,'o');put(cx+1+a-1,foot,'o');}
    else if(frame){put(cx-3,foot,'o');put(cx+2,foot,'o');}else{put(cx-2,foot,'o');put(cx+1,foot,'o');}
  }
  if(flap){const wy=by-ry*0.4+(frame?-2.5:1.5);
    ell(cx-rx-2.6,wy,4.4,2.3,WC);ell(Wd-(cx-rx-2.6),wy,4.4,2.3,WC);
    if(gold){ell(cx-rx-3.4,wy-0.7,2.2,0.8,'n');ell(Wd-(cx-rx-3.4),wy-0.7,2.2,0.8,'n');put(cx-rx-6.6,wy,'w');put(Wd-1-Math.floor(cx-rx-6.6),wy,'w');put(cx-rx-5.6,wy+1,'Q');put(Wd-1-Math.floor(cx-rx-5.6),wy+1,'Q');}
    if(stage>=3){put(cx-rx-6,wy,'w');put(Wd-1-Math.floor(cx-rx-6),wy,'w');}}
  const BC=stage>=6?'w':'y';
  ell(cx+(side?S*0.06:0),by,rx,ry,BC);
  if(stage===5){for(let y=0;y<Hd;y++)for(let x=0;x<Wd;x++)if(g[y][x]==='y'&&(x*3+y*5)%7<3&&y>by-ry*0.4)g[y][x]='w';}
  if(side&&!flap){ell(cx+S*0.14,by+0.3,rx*0.5,ry*0.6,gold?'Q':'Y');if(gold)put(cx+S*0.14-1,by+ry*0.5,'w');}
  if(!side&&!flap){ell(cx-rx+1.3,by+0.5,1.6,ry*0.62,gold?'Q':'Y');ell(Wd-(cx-rx+1.3),by+0.5,1.6,ry*0.62,gold?'Q':'Y');
    if(gold){put(cx-rx+0.5,by-ry*0.4,'w');put(Wd-1-Math.floor(cx-rx+0.5),by-ry*0.4,'w');}}
  if(side){put(cx+rx+S*0.06-0.5,by-ry*0.5,'Y');put(cx+rx+S*0.06+0.5,by-ry*0.8,'Y');}
  ell(hx,hy,hr,hr*0.95,BC);
  if(stage===5){for(let y=0;y<Hd;y++)for(let x=0;x<Wd;x++)if(g[y][x]==='y'&&y<hy&&(x*5+y*3)%9<2)g[y][x]='w';}
  if(stage>=2){const t=Math.floor(hy-hr);put(hx-1,t,'r');put(hx,t,'r');put(hx,t-1,'r');if(stage>=3){put(hx+1,t,'r');put(hx-1,t-1,'r');}
    if(stage>=4){put(hx+1,t-1,'r');put(hx,t-2,'r');put(hx-2,t,'r');}if(stage>=6){put(hx-1,t-2,'r');put(hx+1,t-2,'r');put(hx,t-3,'r');}}
  if(stage>=6&&dir===0){const wy=Math.floor(hy+hr*0.4)+1;put(Wd/2-1,wy,'r');put(Wd/2,wy,'r');put(Wd/2-1,wy+1,'R');put(Wd/2,wy+1,'R');}
  if(stage>=6&&side){const tx=cx+rx+S*0.06;for(let k=0;k<4;k++){put(tx+k*0.9,by-ry*0.4-k*1.1,k%2?'q':'Y');put(tx+k*0.9+0.9,by-ry*0.4-k*1.1+0.9,'q');}}
  if(stage>=5&&!flap&&!side){ell(cx-rx+1.3,by+0.5,1.6,ry*0.62,gold?'Q':stage>=6?'q':'Y');ell(Wd-(cx-rx+1.3),by+0.5,1.6,ry*0.62,gold?'Q':stage>=6?'q':'Y');}
  // Clustered belly shade and a small forehead highlight, on the original grid.
  // Keep head anchors and sprite bounds stable for every outfit and growth stage.
  for(let j=Math.ceil(by+ry*0.42);j<foot;j++)for(let i=0;i<Wd;i++){
    if(g[j][i]===BC)g[j][i]=stage>=6?'n':WC;
  }
  if(stage<6){const ly=Math.max(0,Math.floor(hy-hr*0.65)),lx=Math.floor(hx-hr*0.35);
    for(let i=0;i<Math.max(1,Math.floor(hr*0.7));i++)if(g[ly]&&g[ly][lx+i]===BC)put(lx+i,ly,'w');}
  if(dir===0){const xl=Math.floor(hx-hr*0.45),xr=Wd-1-xl,ey=Math.floor(hy);put(xl,ey,'k');put(xr,ey,'k');
    const by2=Math.floor(hy+hr*0.4);put(Wd/2-1,by2,'o');put(Wd/2,by2,'o');
    if(stage<2){put(xl-1,by2,'p');put(xr+1,by2,'p');}}
  else if(side){put(hx-hr*0.35,hy,'k');const byk=Math.floor(hy+hr*0.25);put(Math.floor(hx-hr)-1,byk,'o');put(Math.floor(hx-hr),byk,'o');
    if(stage<2)put(hx-hr*0.1,byk+1,'p');}
  s=makeSprite(g.map(r=>r.join('')));s.head={x:hx+1,y:hy+1,r:hr,top:hy-hr+1};s.S=S;chickCache.set(key,s);return s;
}
function getChick(stage,dir,frame,flap){const g=has('golden');return dir===3?flipOf(chickSprite(stage,2,frame,flap,g)):chickSprite(stage,dir,frame,flap,g);}
function decorate(base,fn){return mk(base.width,base.height,x=>{x.drawImage(base,0,0);fn(x);});}

const VART={ink:'#202840',wood:'#a66c46',light:'#ce9560',dark:'#594437',cream:'#f6ead0',wall:'#dcad86',red:'#eb6654',redDark:'#a43d43',gold:'#ffe05a',green:'#55aa62',forest:'#2d664e',leaf:'#a1d970',blue:'#409dc5',foam:'#b2e7e0',stone:'#a9b7c5'};

function vRect(g,c,x,y,w=1,h=1){g.fillStyle=VART[c]||c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function vPoly(g,c,pts){
  for(let y=Math.floor(Math.min(...pts.map(p=>p[1])));y<Math.ceil(Math.max(...pts.map(p=>p[1])));y++){
    const hits=[];for(let i=0,j=pts.length-1;i<pts.length;j=i++){
      const a=pts[j],b=pts[i];if((a[1]>y+.5)!==(b[1]>y+.5))hits.push(a[0]+(y+.5-a[1])*(b[0]-a[0])/(b[1]-a[1]));}
    hits.sort((a,b)=>a-b);for(let i=0;i+1<hits.length;i+=2){const l=Math.ceil(hits[i]-.5);vRect(g,c,l,y,Math.ceil(hits[i+1]-.5)-l,1);}
  }
}
function vEllipse(g,c,cx,cy,rx,ry){for(let y=-ry;y<=ry;y++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-y*y/(ry*ry))));vRect(g,c,cx-w,cy+y,w*2+1,1);}}
function vLine(g,c,a,b,w=1){let [x,y]=a;const dx=Math.abs(b[0]-x),dy=-Math.abs(b[1]-y),sx=x<b[0]?1:-1,sy=y<b[1]?1:-1;let e=dx+dy;
  for(;;){vRect(g,c,x,y,w,w);if(x===b[0]&&y===b[1])break;const e2=2*e;if(e2>=dy){e+=dy;x+=sx;}if(e2<=dx){e+=dx;y+=sy;}}}
function vSprite(w,h,fn,ax=w/2,ay=h-4){const s=mk(w,h,g=>fn(g));s.anchorX=ax;s.anchorY=ay;return s;}

  const lobes=small?[[0,22,21,18],[-11,28,12,14],[12,27,12,16]]:[[0,25,25,22],[-19,34,17,18],[20,32,17,20],[-7,43,24,14]];

  R(lit,cx-22,28,5,2);R(lit,cx+12,17,5,2);R(mid,cx+20,42,4,2);
  if(small)for(const [x,y] of [[15,20],[32,16],[35,30],[20,36]]){R('redDark',x,y+1,4,3);R('red',x,y,4,3);R('cream',x,y,1,1);}
 });}

let AC=null,master=null,sfxBus=null,musicGain=null,musicOn=true,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
    sfxBus=AC.createGain();sfxBus.connect(master);
    musicGain=AC.createGain();musicGain.connect(master);applyVolumes();
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    startMusic();}catch(e){AC=null;}
}
function applyVolumes(){if(musicGain)musicGain.gain.value=musicOn?SET.music/10:0;if(sfxBus)sfxBus.gain.value=SET.sound/10;}
function tone(f,d,type='square',v=0.1,slide=0,when=0,dest){
  if(!AC)return;const t=AC.currentTime+Math.max(0,when);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(dest||sfxBus);o.start(t);o.stop(t+d+0.03);
}
function noise(d,v=0.15,freq=1200){
  if(!AC)return;const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+d+0.05);
}

function startMusic(){
  nextT=AC.currentTime+0.1;
  // rain: looped filtered noise whose volume follows the weather
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=0.5;
  rainGain=AC.createGain();rainGain.gain.value=0;s.connect(f);f.connect(rainGain);rainGain.connect(sfxBus);s.start();
  setInterval(()=>{
    if(!AC)return;if(nextT<AC.currentTime-0.2)nextT=AC.currentTime+0.05;
    while(nextT<AC.currentTime+0.3){
      if(wantTrack!==curTrack&&step%8===0){curTrack=wantTrack;step=0;}
      const T=TRACKS[curTrack],STEP=60/T.bpm/2;
      const m=T.mel[step%64],bar=Math.floor((step%64)/8),bs=step%8,w=nextT-AC.currentTime;

      nextT+=STEP;step++;
    }
  },60);
}

function buzz(){try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}}
function toggleFull(){const d=document;try{if(!d.fullscreenElement)d.documentElement.requestFullscreen().catch(()=>{});else d.exitFullscreen();}catch(e){}}
{
  const T=document.getElementById('touch');
  addEventListener('touchstart',()=>{if(!TOUCH){TOUCH=true;resize();}},{passive:true});
  if(!document.documentElement.requestFullscreen)document.getElementById('btnFull').style.display='none';
  T.querySelectorAll('button[data-k]').forEach(b=>{const k=b.dataset.k;
    b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();buzz();b.classList.add('down');if(k==='full'){toggleFull();return;}press(k);});
    const up=()=>{if(k!=='full')keys[k]=false;b.classList.remove('down');};
    b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);});
  // one slide-able d-pad with diagonals
  const dp=document.getElementById('dpad'),DK=['up','down','left','right'];let dpId=null;
  const dpSet=dirs=>{for(const k of DK){const on=dirs.includes(k);if(on&&!keys[k])press(k);if(!on)keys[k]=false;dp.querySelector('.'+k[0]).classList.toggle('on',on);}};
  const dpMove=e=>{const r=dp.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy);
    if(len<r.width*0.12){dpSet([]);return;}const nx=dx/len,ny=dy/len,d=[];
    if(ny<-0.38)d.push('up');if(ny>0.38)d.push('down');if(nx<-0.38)d.push('left');if(nx>0.38)d.push('right');dpSet(d);};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();buzz();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId);}catch(_){}dpMove(e);});
  dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpMove(e);});
  const dpEnd=e=>{if(e.pointerId===dpId){dpId=null;dpSet([]);}};
  dp.addEventListener('pointerup',dpEnd);dp.addEventListener('pointercancel',dpEnd);
  // tapping the game screen = A, except during normal play (so you never peck by accident)
  let tapA=false;

}

/* ---------------- collision ---------------- */
function rectTiles(x,y,w,h,forPlayer){
  const c0=Math.floor(x/16),c1=Math.floor((x+w-0.01)/16),r0=Math.floor(y/16),r1=Math.floor((y+h-0.01)/16);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(solidTile(tileAt(c,r),forPlayer))return true;return false;
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function entBox(e){
  if(e.type==='cityprop'){const h=e.p.hit;return {x:e.ox+h[0],y:e.oy+h[1],w:h[2],h:h[3]};}
  if(e.type==='goose')return {x:e.x-7,y:e.y-12,w:14,h:16};
  if(e.type==='block')return {x:e.x-8,y:e.y-16,w:16,h:16};
  if(e.type==='chest')return {x:e.x-8,y:e.y-8,w:16,h:9};
  return {x:e.x-e.w/2,y:e.y-6,w:e.w,h:7};
}
function pBox(x,y){return {x:x-5,y:y-5,w:10,h:6};}
function pBlocked(x,y){
  const b=pBox(x,y),city=cityLayoutBlocked(b);if(city===true||(city===null&&rectTiles(b.x,b.y,b.w,b.h,true)))return true;
  const cur=pBox(P.x,P.y);
  for(const e of ents){if(!e.solid||e.blown)continue;const eb=entBox(e);if(ov(b,eb)&&!ov(cur,eb))return true;}
  return false;
}
function moveP(dx,dy,nudge){
  if(!dx&&!dy)return true;const nx=P.x+dx,ny=P.y+dy;
  if(!pBlocked(nx,ny)){P.x=nx;P.y=ny;return true;}
  if(nudge){
    if(dx){for(let k=1;k<=7;k++){
      if(!pBlocked(nx,P.y-k)&&!pBlocked(P.x,P.y-1)){P.y-=1;return true;}
      if(!pBlocked(nx,P.y+k)&&!pBlocked(P.x,P.y+1)){P.y+=1;return true;}}}
    else{for(let k=1;k<=7;k++){
      if(!pBlocked(P.x-k,ny)&&!pBlocked(P.x-1,P.y)){P.x-=1;return true;}
      if(!pBlocked(P.x+k,ny)&&!pBlocked(P.x+1,P.y)){P.x+=1;return true;}}}
  }
  return false;
}
function entBlocked(e,x,y){
  const sx=e.sx*256,sy=e.sy*192;if(x<sx+8||x>sx+248||y<sy+14||y>sy+188)return true;
  return rectTiles(x-6,y-5,12,6,false);
}
function entMove(e,dx,dy){if(!entBlocked(e,e.x+dx,e.y))e.x+=dx;if(!entBlocked(e,e.x,e.y+dy))e.y+=dy;}

function puff(x,y,n,colors,spd=1.2,grav=0.04){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*spd+0.3;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.6,g:grav,life:25+Math.random()*20,c:colors[(Math.random()*colors.length)|0]});}}
function float(x,y,s,color='#fff'){floats.push({x,y,s,color,life:60});}
function toast(s,color='#ffe05a'){toasts.push({s:tt(s),color,t:0});}
function updateAmbient(){
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=0.97;p.life--;}parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y-=0.35;f.life--;}floats=floats.filter(f=>f.life>0);
  if(toasts.length){toasts[0].t++;if(toasts[0].t>170)toasts.shift();}
  if(shake>0)shake--;
}

function hint(){
  if(G.part2)return hint2();
  if(G.q.mom===2&&rankFull()&&nextRank().gateHint)return nextRank().gateHint;
  if(G.q.mom<2)return "Peck 3 worms in the dirt patches!";
  if(G.skills.size===0)return "Press E to open your Growth Tree and spend your seeds!";
  for(const k in TRAIN){const t=TRAIN[k];if(t.phase===1&&G.train[k]===1)return t.hint();}
  for(const id of ORDER){if(G.q[id]===1&&QUESTS[id].check())return "Go tell "+NAMES[id]+" the good news!";}
  for(const id of ORDER){if(G.q[id]===0&&!G.met.has(id))return INTRO_HINT[id];}
  for(const id of ORDER){if(G.q[id]===1)return QUESTS[id].hint();}
  if(!has('fly'))return "You've grown so much! Keep spending seeds in your Growth Tree until you learn FLIGHT!";
  return "Go on, fly over that Big Fence! Mama is so proud of you!";
}
function reward(n,id){const base=n;if(wearing('crown'))n++;addSeeds(n,(ORDER2.includes(id)||ORDER3.includes(id)||ORDER4.includes(id)||ORDER5.includes(id)||ORDER6.includes(id))?2:1,(ORDER3.includes(id)||ORDER4.includes(id)||ORDER5.includes(id)||ORDER6.includes(id))?0:base);G.q[id]=2;SFX.questDone();toast('+'+n+' SEEDS!');questGP(id);save();}
function say(lines,onEnd){lines.forEach(l=>l.text=tt(l.text));dlg={lines,i:0,shown:0,onEnd};state='talk';}
function talkTo(e){
  const L=[];const it=(t,fx)=>L.push({who:e,text:t,fx});const me=t=>L.push({who:'me',text:t});
  if(e.id==='duck'||e.id==='rooster')e.flip=P.x>e.x;
  G.met.add(e.id);
  if(e.deco){it(['Baa.','Baaa?','*munch munch*','Baa baa!'][(Math.random()*4)|0]);say(L);return;}
  if(talkP2(e,it)){say(L);return;}
  if(deliverJob(e,it)||returnBorrowed(e,it)){say(L);return;}
  if(e.sib){
    if(e.home){it(e.sib.homeLine);say(L);return;}
    if(G.q.penny===0){it("Shhh! We're playing hide-and-seek! Go talk to Penny in the coop if you want to play!");say(L);return;}
    it(e.sib.found);
    say(L,()=>{puff(e.x,e.y-6,10,['#ffe05a','#fff8ec']);G.sibs.push(e.id);e.home=true;Object.assign(e,at(...((G.coop&&G.coop.lv>=3)?FAMILY_POS[e.id]:e.sib.home)));SFX.chirp();
      toast(G.sibs.length>=3?'Found all 3! Go tell Penny.':'Found '+e.name+'! ('+G.sibs.length+'/3)');save();});
    return;
  }
  const ask=(t,choices,cb)=>L.push({who:e,text:t,choices,cb});
  const spec=TALK[e.id];if(spec&&spec(e,{it,me,ask})!==false){say(L);return;}
  let qid=QUEST_OF[e.id]||e.id;const base=qid;
  {let prev=base;for(const fq of [].concat(FOLLOWUP[e.id]||[])){if(G.q[prev]!==2)break;if(G.q[fq]!==2){if((!FOLLOW_GATE[e.id]||FOLLOW_GATE[e.id]())&&(!FOLLOW_GATE[fq]||FOLLOW_GATE[fq]()))qid=fq;break;}prev=fq;}}
  if(qid===base&&trainTalk(e,it)){say(L);return;}
  const q=QUESTS[qid];if(!q)return;
  const pushLine=l=>typeof l==='string'?it(l):(l.me?me(l.me):it(l.t,l.fx));
  const doneLines=()=>{q.done.forEach((l,i)=>it(l,i===q.done.length-1?()=>{if(q.onDone)q.onDone();reward(q.reward,qid);}:null));(q.post||[]).forEach(pushLine);};
  if(G.q[qid]===0){q.intro.forEach(pushLine);G.q[qid]=1;if(q.check())doneLines();}
  else if(G.q[qid]===1){if(q.check())doneLines();else it(q.remind());}
  else q.after().forEach(pushLine);
  say(L);
}
function speakerPos(who){
  if(who==='me'){const s=getChick(stage(),0,0,false);return {x:P.x-camX,top:P.y-camY+HUD+2-s.height-P.z,bot:P.y-camY+HUD+3,name:'PIP',voice:900};}
  if(who.type){const s=SPR[who.spr];return {x:who.x-camX,top:who.y-camY+HUD+2-s.height,bot:who.y-camY+HUD+3,name:who.name,voice:who.voice};}
  return {x:who.x-camX,top:who.y-camY+HUD,bot:who.y-camY+HUD+16,name:who.name,voice:300};
}
function updateTalk(){
  const d=dlg,line=d.lines[d.i];
  if(!line.started){line.started=true;if(line.fx)line.fx();}
  if(d.shown<line.text.length){
    const before=Math.floor(d.shown);d.shown=Math.min(line.text.length,d.shown+TEXT_SPEED_MUL[SET.speed]);
    if(Math.floor(d.shown)!==before&&before%3===0&&line.text[before]!==' '){const sp=speakerPos(line.who);SFX.blip(sp.voice+((before*37)%60));}
    if(pressed.a)d.shown=line.text.length;
  }else if(line.choices){
    if(pressed.back){dlg=null;state='play';SFX.menu();return;}
    if(pressed.left||pressed.right||pressed.up||pressed.down){d.sel=(d.sel||0)^1;SFX.menu();}
    if(pressed.a){const cb=line.cb,sel=d.sel||0;dlg=null;state='play';SFX.pick();if(cb)cb(sel);}
  }else if(pressed.a||pressed.back){
    d.i++;d.shown=0;SFX.menu();
    if(d.i>=d.lines.length){dlg=null;state='play';if(d.onEnd)d.onEnd();}
  }
}

function frontPoint(){const [dx,dy]=DIRV[P.dir];return {x:P.x+dx*10,y:P.y-4+dy*10,dx,dy};}
function action(){
  const f=frontPoint();
  if(cityInteriorAction(f))return;
  for(const e of ents){if(e.type!=='npc'||!onCur(e))continue;
    if(Math.abs(f.x-e.x)<e.w/2+7&&f.y>e.y-20&&f.y<e.y+7){talkTo(e);return;}}
  if(villageAction(f))return;
  for(const e of ents){if(e.type==='shipdock'&&onCur(e)&&G.sea.open&&Math.abs(f.x-e.x)<26&&Math.abs(f.y-(e.y-4))<20){openCatalog('ship');return;}if(e.type==='seachest'&&onCur(e)&&Math.abs(f.x-e.x)<16&&Math.abs(f.y-(e.y-6))<16){openSeaChest(e);return;}}
  for(const e of ents){if(e.type==='nook'&&onCur(e)&&Math.abs(f.x-e.x)<16&&Math.abs(f.y-(e.y-4))<12){useNook();return;}}
  for(const e of ents){if(e.type==='bowl'&&has('fly')&&onCur(e)&&Math.abs(f.x-e.x)<14&&Math.abs(f.y-(e.y-4))<12){useBowl(e);return;}}
  for(const e of ents){if(e.type==='chest'&&onCur(e)&&Math.abs(f.x-e.x)<14&&Math.abs(f.y-(e.y-4))<12){openChest();return;}}
  for(const e of ents){if(e.type==='plot'&&onCur(e)&&Math.abs(f.x-e.x)<11&&Math.abs(f.y-(e.y-5))<11){P.peckT=10;usePlot(e);return;}}
  const c=Math.floor(f.x/16),r=Math.floor(f.y/16);
  if(tileAt(c,r)==='n'){trySleep();return;}
  if(tileAt(c,r)==='s'&&siteFor(c,r)){siteSign(siteFor(c,r),c,r);return;}
  if(tileAt(c,r)==='s'){const s=SIGNS[c+','+r];if(s){say([{who:{x:c*16+8,y:r*16,name:s.name},text:s.text}]);return;}}
  peck(f);
}

  if(MG&&MG.type==='bonk')for(const e of ents){if(e.type==='hole'&&e.up>0&&Math.abs(e.x-f.x)<14&&Math.abs(e.y-6-f.y)<14){

      float(e.x,e.y-14,'WORM '+Math.min(G.items.worm,3)+'/3','#f6a6b6');

      e.dead=true;G.collected.add(e.id);G.items.carrot++;tasteFood('carrot');SFX.pick();puff(e.x,e.y-4,8,['#f07832','#2d664e','#a66c46']);strawBonus(e.x,e.y);
      float(e.x,e.y-14,'CARROT '+Math.min(G.items.carrot,3)+'/3','#f07832');save();return;}
    if(e.type==='mound'&&Math.abs(e.x-f.x)<12&&Math.abs(e.y-4-f.y)<12){
      if(!has('peck')){SFX.clunk();float(e.x,e.y-14,'Too hard to dig!');return;}

      if(e.has==='bone')spawnItem('bone','bone',e.x,e.y,true);

      else float(e.x,e.y-16,e.has,'#d5e5eb');
      save();return;}
    if((e.type==='fox'&&!e.gone)||(e.type==='goose'&&!e.blown)){
      if(ov(pr,{x:e.x-8,y:e.y-12,w:16,h:14})){hitEnemy(e);return;}}
    if(e.type==='stump'&&Math.abs(e.x-f.x)<13&&Math.abs(e.y-5-f.y)<13){

  }

  updateSunbeam();updateBabysit();updateRace();updateVillage();updateSeas();updateSky();updateCharge();
  if(pressed.dash)tryDash();

  if(pressed.quest){state='quests';questPage=wearing('detective')?4:(G.part2?1:0);sleuthTop=0;SFX.menu();return;}

    if(ix||iy){

      else P.dir=ix<0?2:ix>0?3:iy<0?1:0;
      const sp=speed()*(ix&&iy?0.72:1)*(P.dashT>0?2.5:1),single=!(ix&&iy);let mx=true,my=true;
      if(ix)mx=moveP(ix*sp,0,single);if(iy)my=moveP(0,iy*sp,single);
      P.moving=mx||my;trailPush();

    if(pressed.b)wingFlap();
  }

  if(state!=='play')return;
  if(P.moving&&!P.hop){
    P.stepT=(P.stepT||0)+1;const ch=tileAt(Math.floor(P.x/16),Math.floor((P.y-3)/16));
    if(onPuddle()&&P.stepT%12===0){SFX.splash();puff(P.x,P.y,6,['#a6d0ff','#5d8fd8','#fff8ec'],1,0.08);}
    else if(P.stepT%15===0&&ch!=='W')SFX.step('_'.includes(ch)?'wood':':'.includes(ch)?'straw':';-'.includes(ch)?'stone':'grass');
  }
  updateEnts();if(MG)updateMG();updateAmbient();checkPickups();if(state==='play')checkEdges();
}

function plotRate(e){const st=G.plots[e.id],kind=SEED_TYPES[(st&&st.k)||'plain'];
  if(kind.night&&nightAmt()<0.5)return 0;
  let r=wearing('straw')?1.5:1;if(e.coop&&G.coop){if(G.coop.lv>=4)r=2;else if(G.coop.lv>=3)r=1.5;}
  if(buffActive('bun'))r*=1.25;if(rainAmt()>0.5)r*=2;if(!e.coop&&G.vil.open)r*=seasonPlotMul();{const pr=regionOfPos(e.x,e.y);if(pr&&pr.sky)r*=3;}return r*kind.grow;}
function updatePlots(){for(const e of ents)if(e.type==='plot'){const s=G.plots[e.id];if(s&&s.p<1)s.p=Math.min(1,s.p+plotRate(e)/GROW);}}
function usePlot(e){
  if(!G.thumb){say([{who:'me',text:"This soil looks so soft... Maybe Granny Shell knows how to grow things?"}]);return;}
  const s=G.plots[e.id];
  if(!s){const opts=plantChoices();if(!opts.length){SFX.deny();float(e.x,e.y-16,'Need a seed!','#ff8080');return;}
    if(opts.length===1)plantSeed(e,opts[0]);else openPlantMenu(e,opts);return;}
  const kd=SEED_TYPES[s.k||'plain'];
  if(s.p<1){float(e.x,e.y-16,(kd.night&&nightAmt()<0.5?'Sleeping until night... ':'Growing... ')+Math.floor(s.p*100)+'%','#a1d970');SFX.menu();return;}
  const yield_=kd.yield+(G.rank>=6?1:0)+(wearing('bloom')&&skyRegion()?1:0);if(kd.petal){G.hold.petal++;toast('A rare MOON PETAL! Take it to the museum.','#e8a0d0');if(skyRegion())G.sky.harv.moon++;}
  if(kd.star){G.items.starfruit++;G.sky.harv.star++;tasteFood('starfruit');toast('A glowing STAR-FRUIT!','#ffe05a');}
  if(kd.pumpkin){tasteFood('pumpkin');const wt=pumpkinWeigh(s);toast('Your pumpkin weighs '+wt+' pounds!','#f07832');if(wt>=24&&seasonNow().name==='AUTUMN')contestWin();else if(wt<24)toast('Judges want 24. Water it with Green Wings next time!','#b9d1dd');}
  delete G.plots[e.id];addSeeds(yield_,2,0);G.harvests++;gainGP(GP.harvest);SFX.seed();puff(e.x,e.y-10,10,['#ffe05a','#fff8ec'],1.2,0.05);float(e.x,e.y-18,'+'+yield_+' SEEDS!','#ffe05a');save();
}
/* ---- followers (fawn & baby turtles) ---- */
function followerCount(){return ents.filter(d=>(d.type==='duckling'||d.type==='follower')&&d.mode==='follow').length;}
function reindexFollowers(){let i=0;for(const d of ents)if((d.type==='duckling'||d.type==='follower')&&d.mode==='follow')d.fi=i++;}
function updFollower(e){
  if(e.mode==='swim'){e.y+=0.5;e.alpha=(e.alpha==null?1:e.alpha)-0.01;if(e.alpha<=0)e.dead=true;return;}
  if(e.mode==='follow'){
    const p=TRAIL[Math.max(0,TRAIL.length-1-(e.fi+1)*12)];
    if(p){if(Math.abs(p.x-e.x)>0.3)e.flip=p.x>e.x;e.x+=(p.x-e.x)*0.5;e.y+=(p.y-e.y)*0.5;}
    if(e.kind==='turtle'&&Math.floor(e.y/16)>=80&&e.x<512){
      e.mode='swim';G.turtles.push(e.id);SFX.splash();float(e.x,e.y-12,'Bye bye! '+G.turtles.length+'/3','#b2e7e0');reindexFollowers();
      if(G.turtles.length>=3&&G.q.sandy===1)toast('All turtles safe! Tell Sandy.');save();}
    if(e.kind==='fawn'){const d=ents.find(n=>n.id==='doe');
      if(d&&Math.abs(d.x-e.x)<48&&Math.abs(d.y-e.y)<36){e.mode='home';G.flags.fawn=true;e.x=d.x+16;e.y=d.y+2;SFX.chirp();float(d.x,d.y-24,'Clover!','#ffe05a');reindexFollowers();save();}}
  }else if(e.mode==='wait'&&onCur(e)&&Math.abs(P.x-e.x)<13&&Math.abs(P.y-e.y)<13){
    e.fi=followerCount();e.mode='follow';SFX.chirp();float(e.x,e.y-14,e.kind==='fawn'?'Mama?':'Peep!','#ffe05a');}
}

const DEST={farm:{x:584,y:283,mx:40,my:110,icon:'door'},forest:{x:136,y:1067,mx:128,my:110,icon:'oak'},mountains:{x:136,y:923,mx:128,my:62,icon:'pine'},
  city:{x:600,y:1051,mx:214,my:110,icon:'brickWin'},village:{x:648,y:1436,mx:214,my:158,icon:'hay'},beach:{x:136,y:1179,mx:128,my:158,icon:'palm'},coop:{mx:0,my:0,icon:'cdoor'}};
let mapSel='forest',FLY=null,mapPage=0;
function destOf(k){if(k==='coop'){const S=SITES[G.coop.site],a=DEST[G.coop.site];return Object.assign({},coopExit(),{mx:a.mx+26,my:a.my+18,icon:'cdoor'});}return DEST[k];}

function openMap(){
  if(!G.part2)return;
  if(seaRegion()){   // out at sea the F key opens the sea chart instead of the sky map
    if(typeof bossActive==='function'&&bossActive()){toast('No sailing away from the fight!','#ff8080');return;}
    if(G.sea.open)openSailMap();return;}
  const k=CS.x+','+CS.y;if(!WALK.has(k)){toast('Go outside to fly!','#b2e7e0');return;}
  mapPage=skyArea()?1:0;state='map';mapSel=areaOf()||'farm';if(mapPage&&!skyMapNodes().includes(mapSel))mapSel='meadows';SFX.menu();

function updateMap(){
  if(pressed.back||pressed.fly||pressed.quest||pressed.grow){state='play';SFX.menu();return;}
  if(pressed.b&&G.sky.open){mapPage^=1;mapSel=mapPage?'meadows':(areaOf()&&!skyArea()&&mapNodes().includes(areaOf())?areaOf():'mountains');if(!mapNodes().includes(mapSel))mapSel=mapPage?'meadows':'farm';SFX.menu();return;}
  const nodes=mapNodes(),cur=destOf(mapSel);
  for(const [k,dx,dy] of [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]]){if(!pressed[k])continue;
    let best=null,bs=1e9;for(const n of nodes){if(n===mapSel)continue;const d=destOf(n),vx=d.mx-cur.mx,vy=d.my-cur.my,al=vx*dx+vy*dy;if(al<=0)continue;
      const sc=al+Math.abs(vx*dy-vy*dx)*2;if(sc<bs){bs=sc;best=n;}}

  if(pressed.a){FLY={t:0,dest:mapSel};state='flying';SFX.magic();}

function updateFlying(){

/* ===== src/systems/hazards.js ===== */
/* ---------------- Part 2 hazards (gentle!) and secret spots ----------------
   Forest: grumpy bees near 2 hives (Wing Flap scatters them)
   Mountains: rolling snowballs on set lanes (Super Peck smashes them)
   Beach: snappy crabs near the shells (Peck knocks them back)
   City: safe.  Ninja stealth shrinks how far away they notice Pip.            */
const HIVES=[[12,63],[27,61]];
const SNOW_LANES=[ // horizontal: roll along a row from one column to another; vertical: along a column
  {axis:'x',fixed:56,from:13,to:1,delay:150},
  {axis:'y',fixed:21,from:49,to:58,delay:210}];
const CRABS=[[6,77,3],[11,76,3],[24,74,2]];
const SPOTS=[
  {id:'spot_forest',kind:'log',c:20,r:62,name:'a hollow log'},
  {id:'spot_peak',kind:'ice',c:18,r:57,name:'an ice cave'},
  {id:'spot_beach',kind:'sandmound',c:11,r:75,name:'a sand mound'},
  {id:'spot_city',kind:'planter',c:46,r:81,name:'a rooftop garden'}];
function makeHazards(){
  HIVES.forEach(([c,r],i)=>{const x=c*16+8,y=r*16+12;
    addEnt({type:'hive',x,y,sx:Math.floor(x/256),sy:Math.floor(y/192),solid:true,w:12});
    addEnt({type:'bees',x:x,y:y-6,hx:x,hy:y-6,sx:Math.floor(x/256),sy:Math.floor(y/192),st:'home',t:0,cool:0,ph:i*40});});
  SNOW_LANES.forEach((L,i)=>{const e={type:'snowball',lane:L,st:'wait',t:L.delay*0.5,x:0,y:0};
    if(L.axis==='x'){e.sx=Math.floor(L.from*16/256);e.sy=Math.floor(L.fixed*16/192);}else{e.sx=Math.floor(L.fixed*16/256);e.sy=Math.floor(L.from*16/192);}
    ballPlace(e,L.from);addEnt(e);});
  CRABS.forEach(([c,r,rng],i)=>{const x=c*16+8,y=r*16+12;
    addEnt({type:'crab',x,y,hx:x,hy:y,rng:rng*16,dir:i%2?1:-1,sx:Math.floor(x/256),sy:Math.floor(y/192),stun:0,kt:0,kx:0,flash:0,cool:0});});
  SPOTS.forEach(s=>{if(!G.collected.has(s.id))addEnt({type:'spot',id:s.id,skind:s.kind,spotName:s.name,x:s.c*16+8,y:s.r*16+12});});
}
function resetHazards(){
  for(const e of ents){
    if(e.type==='bees'){e.x=e.hx;e.y=e.hy;e.st='home';e.cool=60;}
    else if(e.type==='snowball'){e.st='wait';e.t=e.lane.delay*0.5;ballPlace(e,e.lane.from);}
    else if(e.type==='crab'){e.x=e.hx;e.stun=0;e.kt=0;}
  }
}
function stealth(near,ninjaNear){return wearing('ninja')?ninjaNear:near;}
function ballPlace(e,v){const L=e.lane;if(L.axis==='x'){e.x=v*16+8;e.y=L.fixed*16+12;}else{e.x=L.fixed*16+8;e.y=v*16+12;}e.pos=v;}

function updBees(e){
  e.ph=(e.ph||0)+1;
  if(e.cool>0)e.cool--;
  const dx=P.x-e.x,dy=P.y-6-e.y,d=Math.hypot(dx,dy)||1;
  if(e.st==='home'){
    e.x=e.hx+Math.cos(e.ph/14)*7;e.y=e.hy+Math.sin(e.ph/9)*4;
    if(e.cool<=0&&!P.hop&&d<stealth(34,13)){e.st='chase';e.t=170;float(e.x,e.y-14,'BZZZ!','#ffe05a');}
  }else if(e.st==='chase'){
    e.x+=dx/d*0.8+Math.cos(e.ph/4)*0.3;e.y+=dy/d*0.8+Math.sin(e.ph/5)*0.3;
    if(--e.t<=0){e.st='return';}
    if(d<9&&P.inv<=0&&!P.hop){hurt(e);e.st='return';e.cool=120;}
  }else{ // return
    const hx=e.hx-e.x,hy=e.hy-e.y,hd=Math.hypot(hx,hy);
    if(hd<2){e.st='home';e.cool=Math.max(e.cool,90);}else{e.x+=hx/hd*1.3;e.y+=hy/hd*1.3;}
  }
}
function updBall(e){
  const L=e.lane;e.t++;
  if(e.st==='wait'){if(e.t>=L.delay&&onCur(e)){e.st='tell';e.t=0;}ballPlace(e,L.from);return;}
  if(e.st==='tell'){ballPlace(e,L.from);if(e.t>=45){e.st='roll';e.t=0;}return;}
  if(e.st==='roll'){
    const step=(L.to>L.from?1:-1)*1.7/16;e.pos+=step;ballPlace(e,e.pos);
    if((L.to-e.pos)*(L.to>L.from?1:-1)<=0){e.st='wait';e.t=0;}
    else if(Math.abs(e.x-P.x)<9&&Math.abs(e.y-P.y)<9&&P.inv<=0&&!P.hop)hurt(e);
    return;}
  if(e.st==='smashed'){if(e.t>=300){e.st='wait';e.t=L.delay-60;}}
}
function updCrab(e){
  if(e.flash>0)e.flash--;
  if(e.kt>0){e.kt--;entMove(e,e.kx,0);return;}
  if(e.stun>0){e.stun--;return;}
  if(e.cool>0)e.cool--;
  const dxp=P.x-e.x,dyp=P.y-e.y,near=Math.abs(dxp)<stealth(34,12)&&Math.abs(dyp)<14;
  const sp=near&&e.cool<=0?0.95:0.45;
  const nx=e.x+e.dir*sp;
  if(Math.abs(nx-e.hx)>e.rng||entBlocked(e,nx,e.y))e.dir*=-1;else e.x=nx;
  if(Math.abs(dxp)<10&&Math.abs(dyp)<8&&P.inv<=0&&!P.hop){hurt(e);e.cool=90;}
}
/* peck hooks: returns true when the peck was used on a hazard or spot */
function hazardPeck(e,f,pr){
  if(e.type==='crab'&&ov(pr,{x:e.x-9,y:e.y-12,w:18,h:14})){
    const away=e.x>=P.x?1:-1;e.kx=away*3.2;e.kt=12;e.stun=70;e.flash=10;e.dir=away;SFX.brk();float(e.x,e.y-16,'SNAP!','#ff9cd0');return true;}
  if(e.type==='snowball'&&e.st==='roll'&&ov(pr,{x:e.x-8,y:e.y-12,w:16,h:16})){
    if(has('super')){e.st='smashed';e.t=0;SFX.brk();shake=5;puff(e.x,e.y-6,16,['#fff8ec','#cfdcec','#b2e7e0'],1.8,0.06);float(e.x,e.y-16,'SMASH!','#b2e7e0');}
    else{SFX.clunk();float(e.x,e.y-16,'Too big! Dodge!','#b2e7e0');}
    return true;}
  if(e.type==='spot'&&Math.abs(e.x-f.x)<13&&Math.abs(e.y-4-f.y)<13){
    if(!has('peck')){SFX.clunk();float(e.x,e.y-14,'Too hard to dig!');return true;}
    e.dead=true;G.collected.add(e.id);SFX.chirp();puff(e.x,e.y-4,12,['#ffd21e','#fff8ec','#b69965'],1.4,0.06);
    spawnItem(e.id+'_seed','seed',e.x,e.y,true);toast('You found '+e.spotName+'!','#ffd21e');save();return true;}
  return false;
}
function hazardFlap(dx,dy){
  for(const e of ents){if(e.type!=='bees'||e.st==='home'&&Math.hypot(e.x-P.x,e.y-P.y)>56)continue;
    const vx=e.x-P.x,vy=e.y-P.y,along=vx*dx+vy*dy,lat=Math.abs(vx*dy-vy*dx);
    if(along>-6&&along<64&&lat<26){e.st='return';e.cool=240;puff(e.x,e.y,8,['#ffe05a','#202840'],1.6,0);float(e.x,e.y-14,'Shoo!','#fff8ec');}}
}

function drawHaz(e,sx,sy){
  switch(e.type){
    case 'hive':{ctx.fillStyle='#202840';ctx.fillRect(sx-7,sy-14,14,15);ctx.fillStyle='#e8a02c';ctx.fillRect(sx-6,sy-13,12,13);
      ctx.fillStyle='#c98a00';for(let j=0;j<3;j++)ctx.fillRect(sx-6,sy-10+j*4,12,1);ctx.fillStyle='#202840';ctx.fillRect(sx-2,sy-5,4,5);
      ctx.fillStyle='#594437';ctx.fillRect(sx-1,sy-17,2,3);break;}
    case 'bees':{const n=5;for(let i=0;i<n;i++){const a=e.ph/5+i*1.3,bx=Math.round(sx+Math.cos(a*1.3)*5+(i-2)*2),by=Math.round(sy-4+Math.sin(a)*4);
        ctx.fillStyle='#202840';ctx.fillRect(bx,by,3,2);ctx.fillStyle='#ffe05a';ctx.fillRect(bx+(i%2),by,1,2);ctx.fillStyle='#fff8ec';ctx.fillRect(bx,by-1,1+((e.ph>>1)%2),1);}
      break;}
    case 'snowball':{if(e.st==='wait'||e.st==='smashed')break;
      const L=e.lane,tell=e.st==='tell',w=tell?Math.round(Math.sin(e.t/2)):0;
      if(tell){ctx.fillStyle='rgba(255,120,120,0.55)';const a=(e.t%12<6)?1:0;ctx.fillRect(sx-3,sy-16,6,2+a);ctx.fillRect(sx-1,sy-13,2,2);}
      const r=7,rot=e.pos*10;ctx.fillStyle='#202840';ctx.beginPath();ctx.arc(sx+w,sy-6,r+1,0,6.3);ctx.fill();
      ctx.fillStyle='#f4f8ff';ctx.beginPath();ctx.arc(sx+w,sy-6,r,0,6.3);ctx.fill();
      ctx.fillStyle='#cfdcec';ctx.fillRect(Math.round(sx+Math.cos(rot)*3),Math.round(sy-6+Math.sin(rot)*3),2,2);ctx.fillRect(Math.round(sx-Math.cos(rot)*3),Math.round(sy-6-Math.sin(rot)*3),2,2);break;}
    case 'crab':{if(e.flash>0&&Math.floor(e.flash/2)%2)break;
      const c='#eb6654',k='#202840',l=(Math.floor(tick/6)+(e.x|0))%2;shadow(sx,sy+1,8);
      ctx.fillStyle=k;ctx.fillRect(sx-7,sy-8,14,8);ctx.fillRect(sx-9,sy-12,4,5);ctx.fillRect(sx+5,sy-12,4,5);

/* ---------------- growth backbone: growth points (GP), ranks, taste log, rank-up scene ---------------- */
let RU=null;                                   // the rank-up celebration in progress
function rankNum(){return G?G.rank:1;}
function rankAtLeast(n){return !!G&&G.rank>=n;}
function nextRank(){return G&&RANKS[G.rank]||null;}
function rankPointsMet(){const n=nextRank();return !!n&&G.gp>=n.gp;}
function rankGateOk(n){return !n.gate||!!n.gate();}
function rankFull(){const n=nextRank();return !!n&&G.gp>=n.gp&&!rankGateOk(n);}   // "FULL - ready to grow!"
function rankProgress(){const n=nextRank(),c=RANKS[G.rank-1];if(!n)return 1;return clamp((G.gp-c.gp)/(n.gp-c.gp),0,1);}
function stageOfRank(r){return r>=7?6:r-1;}

function gainGP(n,note){
  if(!G||!(n>0))return;
  G.gp+=n;
  if(P&&state!=='title')float(P.x,P.y-30,'+'+n+' GROWTH','#a1d970');
}
function questGP(id){gainGP((ORDER3.includes(id)||ORDER4.includes(id)||ORDER5.includes(id)||ORDER6.includes(id))?GP.quest3:ORDER2.includes(id)?GP.quest2:GP.quest1);}
function tasteFood(id){
  if(!G||G.taste[id])return;G.taste[id]=1;gainGP(GP.taste);
  if(wearing('chef'))gainGP(1);
  const f=FOODS.find(x=>x.id===id);toast('Tasted '+(f?f.name:id)+' for the first time! +'+GP.taste+' growth','#a1d970');
}
function secretFound(id){
  if(!G||G.secrets[id])return;G.secrets[id]=1;gainGP(GP.secret);
  const s=SECRET_IDS.find(x=>x.id===id);toast('Secret found: '+(s?s.name:id)+'! +'+GP.secret+' growth','#d890ff');
}
function minigameGP(key,win){
  if(!win||!G)return 0;
  if(!G.mgFirst[key]){G.mgFirst[key]=1;gainGP(GP.mgFirst);return GP.mgFirst;}
  const d=dayNum();if(G.mgDay.d!==d){G.mgDay={d,n:0};}
  if(G.mgDay.n<GP.mgPerDay){G.mgDay.n++;gainGP(GP.mgRepeat);return GP.mgRepeat;}
  return 0;
}
function grantOutfit(id){
  if(G.outfits.includes(id))return false;G.outfits.push(id);gainGP(GP.outfit);return true;
}

function checkRankUp(){

}
function startRankUp(n,then){

/* ---- save migration: award growth for everything an older save already did ---- */
function migrateGrowth(s){
  if(s.gp!==undefined){G.gp=s.gp;G.rank=s.rank||1;G.taste=s.taste||{};G.secrets=s.secrets||{};G.mgFirst=s.mgFirst||{};G.mgDay=s.mgDay||{d:-1,n:0};
    G.acc=s.acc||null;G.accessoryUnlocked=!!s.accessoryUnlocked;G.snackFirst=!!s.snackFirst;G.snackEaten=s.snackEaten||0;return;}
  let gp=0;
  for(const id of ['mom',...ORDER])if(G.q[id]===2)gp+=GP.quest1;
  for(const id of ORDER2)if(G.q[id]===2)gp+=GP.quest2;
  for(const k in TRAIN)if(G.train[k]===2||has(k))gp+=GP.training;
  gp+=G.skills.size*GP.skill;
  const col=p=>[...G.collected].some(x=>x.startsWith(p));
  const tasted={worm:G.q.mom>=2,carrot:col('carrot'),apple:col('apple_'),acorn:col('acorn_'),fish:!!G.items.fish||G.q.remy===2,snowberry:!!G.items.snowberry||G.q.remy===2,cheese:G.q.squeaks>=2||!!G.items.cheese};
  for(const f of FOODS)if(tasted[f.id]){G.taste[f.id]=1;gp+=GP.taste;}
  const mg={bonk:G.outfits.includes('ears'),ffly:G.outfits.includes('pirate'),egg:G.outfits.includes('bow')};
  for(const k in mg)if(mg[k]){G.mgFirst[k]=1;gp+=GP.mgFirst;}
  const sec={burrow:G.outfits.includes('ears')||G.best.bonk>0,cellar:G.cellar||G.chest,grove:G.outfits.includes('pirate')||G.best.ffly>0};
  for(const k in sec)if(sec[k]){G.secrets[k]=1;gp+=GP.secret;}
  for(const id of ['seed_pen','seed_crate','seed_rock','seed_leaf','seed_mound','spot_forest_seed','spot_peak_seed','spot_beach_seed','spot_city_seed'])if(G.collected.has(id))gp+=GP.hiddenSeed;
  gp+=G.outfits.length*GP.outfit;
  if(G.coop)gp+=(G.coop.lv-1)*GP.coop;
  gp+=(G.harvests||0)*GP.harvest;
  G.gp=gp;
  let r=1;while(RANKS[r]&&G.gp>=RANKS[r].gp&&(!RANKS[r].gate||(RANKS[r].n===5?G.skills.has('fly'):RANKS[r].n===7?!!G.flags.festival:false)))r++;
  G.rank=r;
  if(r>=7){G.accessoryUnlocked=true;if(G.wear&&ACCESSORY_IDS.includes(G.wear)){G.acc=G.wear;G.wear=null;}}
  if(gp>0)G.growMsgOnLoad=true;
}

function startBabysit(){

function updCduck(e){
  e.ph=(e.ph||0)+1;

  const p=TRAIL[Math.max(0,TRAIL.length-1-(e.i+1)*14)];

function buyUpgrade(u){

/* ---- per-frame ---- */
let warpCool=0,lastSafe=null,lavaT=0,springT=0;
function updateSeas(){
  if(!G||!P)return;
  if(warpCool>0)warpCool--;
  if(P.dashT>0){P.dashT--;}
  if(P.dashCd>0)P.dashCd--;
  const rg=regionAt();if(!rg)return;
  if(rg.sea){
    const under=tileAt(Math.floor(P.x/16),Math.floor((P.y-3)/16));
    if(under==='>'||under==='<'){if(!has('sealegs')&&!P.hop){moveP(under==='>'?0.8:-0.8,0,false);}else if(tick%90===0)float(P.x,P.y-24,'Sea legs!','#b2e7e0');}
    if(under==='{'&&P.inv<=0&&!P.hop&&!(P.dashT>0)){hurt({x:P.x,y:P.y});if(lastSafe){P.x=lastSafe.x;P.y=lastSafe.y;float(P.x,P.y-24,'Hot hot hot!','#ffb030');}}
    else if(under!=='{'&&under!=='w'&&!P.hop)lastSafe={x:P.x,y:P.y};
    if(under==='}'){if(++springT%120===0&&G.hearts<maxHearts()){G.hearts++;SFX.pick();float(P.x,P.y-24,'Ahh... +1','#a1d970');}}else springT=0;
  }
  // swim/dive handling: air meter in deep reef
  if(inDeep()){
    G.air=Math.max(0,(G.air==null?AIR_MAX:G.air)-(G.rank>=9&&tick%3===0?0:1));
    if(G.air<=0&&state==='play'){surface(true);}
  }else G.air=AIR_MAX;
  for(const e of ents){
    if(e.type==='swarp'&&onCur(e)&&warpCool<=0&&state==='play'&&!WARP&&Math.abs(P.x-e.x)<10&&Math.abs(P.y-e.y)<10){
      if(e.dive&&!has('dive')){warpCool=60;float(e.x,e.y-20,'Learn DIVE first!','#b2e7e0');SFX.deny();continue;}
      warpCool=50;warpTo(e.to.x,e.to.y,e.up?1:0,null,()=>{if(e.dive){G.air=AIR_MAX;toast('Blub blub! Watch your AIR.','#b2e7e0');}else if(e.up)toast('Fresh air!','#b2e7e0');});}
  }
  updateSeaQuests();
}
function surface(gasp){
  const up=ents.find(e=>e.type==='swarp'&&e.up&&regionAt()===regionOfPos(e.x,e.y));
  const t=(ents.find(e=>e.type==='swarp'&&e.up&&e.to&&regionOfPos(e.x,e.y)===regionAt())||ents.find(e=>e.type==='swarp'&&e.up)).to;
  G.air=AIR_MAX;warpCool=60;warpTo(t.x,t.y,1,null,()=>toast(gasp?'Pop! Pip bobs up gasping for air.':'Fresh air!','#b2e7e0'));
}
/* ---- skills: Dash, Cannon Peck ---- */
function tryDash(){
  if(!has('dash')||P.dashCd>0||P.hop||P.flying)return;
  P.dashT=14;P.dashCd=70;P.inv=Math.max(P.inv,18);SFX.gust();
  const [dx,dy]=DIRV[P.dir];for(let i=0;i<8;i++)parts.push({x:P.x-dx*8,y:P.y-6-dy*8,vx:-dx*(1+Math.random()),vy:-dy*(1+Math.random())-0.3,g:0,life:14,c:i%2?'#fff8ec':'#ffe05a'});
}
let prevA=false,aHold=0;
function updateCharge(){
  const held=!!keys.a&&state==='play';
  if(held)aHold++;
  if(has('cpeck')&&prevA&&!held&&aHold>=32){cannonPeck();}
  if(!held)aHold=0;prevA=held;P.charge=has('cpeck')&&held&&aHold>10?aHold:0;
}
function cannonPeck(){
  const [dx,dy]=DIRV[P.dir];SFX.brk();shake=5;P.peckT=14;
  for(let i=0;i<18;i++)parts.push({x:P.x+dx*10,y:P.y-6+dy*10,vx:dx*(2+Math.random()*3),vy:dy*(2+Math.random()*3),g:0,life:20,c:i%2?'#ffe05a':'#ff6fae'});
  let hit=0;
  for(const e of ents){if(!onCur(e))continue;
    const vx=e.x-P.x,vy=e.y-P.y,along=vx*dx+vy*dy,lat=Math.abs(vx*dy-vy*dx);
    if(along<-4||along>58||lat>18)continue;
    if(e.type==='crab'){e.kx=dx*5;e.kt=18;e.stun=120;hit++;}
    else if(e.type==='gullp'){gullKnock(e);hit++;}
    else if(e.type==='jelly'){e.stun=150;e.hx=e.x+dx*40;e.hy=e.y+dy*40;hit++;}
    else if(e.type==='boss'){bossHit(2);hit++;}
    else if(e.type==='barrel'){e.vx=dx*3;e.vy=dy*3;e.back=true;hit++;}}
  if(hit)float(P.x,P.y-24,'KAPOW!','#ffe05a');
}

/* ---- enemies ---- */
function gullKnock(e){e.st='gone';e.gone=600;e.flash=10;SFX.honk();puff(e.x,e.y,10,['#fff8ec','#e8e8f0'],1.4,0.05);float(e.x,e.y-16,'SQUAWK!','#fff8ec');}
function updGull(e){
  if(e.flash>0)e.flash--;
  if(e.gone>0){e.gone--;if(e.gone<=0){e.st='patrol';e.t=0;e.x=e.hx;e.y=e.hy;}return;}
  e.t++;
  const dx=P.x-e.x,dy=P.y-6-e.y;
  if(e.st==='patrol'){e.x=e.hx+Math.cos(e.t/50+e.ph)*34;e.y=e.hy+Math.sin(e.t/37+e.ph)*8;e.flip=Math.sin(e.t/50+e.ph)>0;
    if(e.t>90&&Math.hypot(P.x-e.hx,P.y-e.hy)<(wearing('ninja')?38:92)&&!P.hop){e.st='tell';e.t=0;e.tx=P.x;e.ty=P.y-6;SFX.honk();}}
  else if(e.st==='tell'){e.x+=(Math.random()-.5)*1.2;if(e.t>=28){e.st='dive';e.t=0;e.tx=P.x;e.ty=P.y-6;}}
  else if(e.st==='dive'){const vx=e.tx-e.x,vy=e.ty-e.y,d=Math.hypot(vx,vy)||1;e.flip=vx>0;
    if(d>4&&e.t<44){e.x+=vx/d*3.2;e.y+=vy/d*3.2;}else{e.st='rest';e.t=0;}
    if(Math.abs(P.x-e.x)<10&&Math.abs(P.y-6-e.y)<10&&P.inv<=0&&!P.hop){hurt(e);e.st='rest';e.t=0;}}
  else if(e.st==='rest'){if(e.t>=36){e.st='rise';e.t=0;}}
  else if(e.st==='rise'){const vx=e.hx-e.x,vy=e.hy-e.y,d=Math.hypot(vx,vy);if(d<3){e.st='patrol';e.t=-60;}else{e.x+=vx/d*1.4;e.y+=vy/d*1.4;}}
}
function updJelly(e){
  if(e.flash>0)e.flash--;
  if(e.stun>0){e.stun--;e.x+=(e.hx-e.x)*0.04;e.y+=(e.hy-e.y)*0.04;return;}
  e.ph+=0.02;e.x=e.hx+Math.cos(e.ph*1.3)*22;e.y=e.hy+Math.sin(e.ph)*14;
  if(Math.abs(P.x-e.x)<10&&Math.abs(P.y-6-e.y)<9&&P.inv<=0&&!P.hop){hurt(e);e.stun=60;}
}
function updSpark(e){
  e.t++;const c=e.t%190;
  if(c<44){const p=c/44;e.up=1;e.x=e.bx+Math.sin(p*Math.PI)*6;e.y=e.by-Math.sin(p*Math.PI)*38;
    if(Math.abs(P.x-e.x)<8&&Math.abs(P.y-6-e.y)<9&&P.inv<=0&&!P.hop&&!(P.dashT>0))hurt(e);}
  else{e.up=0;e.x=e.bx;e.y=e.by;}
}
function updBubbles(e){if(e.cool>0){e.cool--;return;}
  if(Math.abs(P.x-e.x)<12&&Math.abs(P.y-6-e.y)<14){G.air=Math.min(AIR_MAX,(G.air||0)+1500);e.cool=700;SFX.pop();float(e.x,e.y-18,'AIR!','#b2e7e0');}}
/* ---- peck / flap hooks ---- */
function seaPeck(e,f,pr){

/* ---- garden: special seeds ---- */
let PL=null;   // planting menu
function plantChoices(){
  const L=[];if(G.seeds>=1)L.push('plain');
  for(const k of ['speedy','giant','moon','star','pumpkin'])if(G.sacks[k]>0)L.push(k);

const DECOR_POS={flowers:[[34,52],[45,52]],lights:[[36,50],[43,50],[45,50]],lamp:[[40,57]],painting:[[40,49]]};
function placeDecor(){
  ents=ents.filter(e=>e.type!=='decor');
