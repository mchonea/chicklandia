/* ---- post office parcels ---- */
const JOB_PAY={seeds:1,gp:3};
function refreshJobs(){
  const d=dayNum();if(G.jobs.day===d)return;G.jobs.day=d;
  G.jobs.list=G.jobs.list.filter(j=>j.st!==2);
  const n=1+(hash2(d,7)%2);                         // one or two new runs each in-game day
  for(let i=0;i<n&&G.jobs.list.length<4;i++){
    let k=hash2(d*3+i,11)%JOB_TARGETS.length,tries=0;
    while(G.jobs.list.some(j=>j.to===JOB_TARGETS[k][0])&&tries++<20)k=(k+1)%JOB_TARGETS.length;
    G.jobs.list.push({to:JOB_TARGETS[k][0],st:0});}
}
function deliverJob(e,it){
  const j=G.jobs.list.find(x=>x.to===e.id&&x.st===1);if(!j)return false;
  it("A parcel from the post office? For me? Thank you so much, Pip!",()=>{j.st=2;G.flags.parcels=(G.flags.parcels||0)+1;addSeeds(JOB_PAY.seeds,inBeyond(e.x,e.y)?2:1,0);gainGP(JOB_PAY.gp);
    toast('Delivered! +'+JOB_PAY.seeds+' seeds','#b2e7e0');SFX.questDone();save();});
  return true;
}

/* ---- museum ---- */
function donatable(){return EXHIBITS.some(x=>G.hold[x.item]>0&&G.museum[x.id]<x.need);}
function donateAll(){
  let any=false;
  for(const x of EXHIBITS){const n=Math.min(G.hold[x.item]||0,x.need-G.museum[x.id]);if(n<=0)continue;
    G.hold[x.item]-=n;G.museum[x.id]+=n;any=true;
    if(G.museum[x.id]>=x.need){addSeeds(x.reward.seeds,2,0);gainGP(x.reward.gp);toast(x.name+' exhibit complete! +'+x.reward.seeds+' seeds','#ffe05a');SFX.questDone();}}
  if(!any){SFX.deny();return {s:"You aren't carrying anything the museum needs yet.",c:'#ff8080'};}
  SFX.pick();save();return {s:'Thank you! The exhibit looks wonderful.',c:'#a1d970'};
}
function museumFull(){return EXHIBITS.every(x=>G.museum[x.id]>=x.need);}

/* ---- library ---- */
function guideLines(area){
  const out=[],pool={farm:['mom',...ORDER],forest:['granny','bucky','doe'],mountains:['mo','elda'],beach:['pinch','sandy'],city:['pidge','remy','rocco','cleo','cookoff','vane','babysit','portrait']}[area]||[];
  for(const id of pool){const q=QUESTS[id];if(!q||!q.hint)continue;if(G.q[id]===1||(G.q[id]===0&&G.met.has(id)))out.push(q.hint());}
  if(!out.length){const left=pool.filter(id=>G.q[id]===0).length;
    out.push(left?'There are friends here who still need help. Explore and say hello!':'You have helped everyone here. What a good friend!');}
  return out.slice(0,3);
}
function readGuide(b){
  const lib=ents.find(e=>e.id==='olive'),L=[{who:lib||'me',text:"The "+b.name+": "+guideLines(b.area)[0]}];
  guideLines(b.area).slice(1).forEach(t=>L.push({who:lib||'me',text:t}));
  state='play';SH=null;say(L);
}
function readLore(l){const lib=ents.find(e=>e.id==='olive');state='play';SH=null;say(l.text.map(t=>({who:lib||'me',text:t})));}
function readStory(){G.flags.stories=(G.flags.stories||0)+1;say([{who:'me',text:STORIES[(G.flags.stories-1)%STORIES.length]},{who:'me',text:"What a lovely story. I feel cozy now."}]);}

/* ---------------- reusable catalog UI that every city shop uses ----------------
   SHOPS[id] = {title, owner (sprite key), color, intro, items:()=>[...]}  (data lives in content/shops.js)
   an item = {name, price?, tag?, desc, bonus?, outfit? (id to preview on Pip), icon? (SPR key), off?, act()->{s,c}|undefined}
   Up/Down choose, Z does the item's action, ESC (or the LEAVE row) closes. */
let SH=null;
function openCatalog(id){SH={id,sel:0,top:0,msg:null};state='catalog';SFX.menu();}
function catalogItems(){return SHOPS[SH.id].items();}
function updateCatalog(){
  const items=catalogItems(),n=items.length+1;
  if(pressed.back||pressed.wear||pressed.quest||pressed.grow){state='play';SH=null;SFX.menu();return;}
  if(pressed.up){SH.sel=(SH.sel+n-1)%n;SH.msg=null;SFX.menu();}
  if(pressed.down){SH.sel=(SH.sel+1)%n;SH.msg=null;SFX.menu();}
  SH.top=clamp(SH.top,Math.max(0,SH.sel-4),SH.sel);
  if(!pressed.a)return;
  if(SH.sel===items.length){state='play';SH=null;SFX.menu();return;}
  const it=items[SH.sel];
  if(it.off){SFX.deny();SH.msg={s:it.offMsg||'Not available yet.',c:'#ff8080'};return;}
  const sid=SH.id,r=it.act&&it.act();
  if(state==='catalog'&&SH&&SH.id===sid){if(r){SH.msg=r;}if(!r||r.c!=='#ff8080')SFX.pick();else SFX.deny();}
}

  drawImg(SPR.seed,196,26);txt('x'+G.seeds,206,28,7,'#fff8ec');

  box(150,40,94,100,'#2e2048','#7896ae');

  box(12,148,W-24,66,'#192639','#7896ae');
  if(cur&&!cur.leave){txt(cur.name,20,154,7,S.color);wrap(cur.desc||'',5,W-44).slice(0,2).forEach((l,i)=>txt(l,20,165+i*8,5,'#d5e5eb'));
    if(cur.bonus)wrap('BONUS: '+cur.bonus,5,W-44).slice(0,2).forEach((l,i)=>txt(l,20,182+i*8,5,'#a1d970'));}
  else txt(S.bye||'Come back soon!',20,160,6,'#d5e5eb');

function shopBuy(price,what,fn){
  if(G.seeds<price){const k=price-G.seeds;SFX.deny();return {s:'You need '+k+' more seed'+(k>1?'s':'')+'.',c:'#ff8080'};}

}

/* ---------------- Sky Kingdom: bouncy clouds, vents, wind, storms, the sky gate, hatching, naming, chime puzzle ---------------- */
for(const c of SKY_CAST){const p=SKO[c.o];CHARACTERS.push({id:c.id,name:c.name,spr:c.spr,c:p[0]+c.c,r:p[1]+c.r,voice:c.voice,w:c.w});}
Object.assign(AREA_LABEL,{meadows:'CLOUD MEADOWS',gardens:'FLOATING GARDENS',skycity:'CLOUD CITY',peaks:'STORM PEAKS',lair:"DRAGON'S LAIR"});
Object.assign(WEAR_ICON,{quill:OUTFIT_SPR.quill,bloom:OUTFIT_SPR.bloom,stormcap:OUTFIT_SPR.stormcap,scarf:OUTFIT_SPR.scarf});
function skyRegion(){const r=regionAt();return !!r&&!!r.sky;}
function skyArea(){const r=regionAt();return r&&r.sky&&r.area?r.area:null;}
function skyRain(){const r=regionAt();if(r&&r.sky)return (r.area==='peaks'||r.area==='lair')?0.55:0;return rainAmt();}
function skyDark(){const r=regionAt();if(!r||!r.sky||r.kind==='indoor')return null;const n=nightAmt();
  if(r.area==='peaks')return 0.3+n*0.25;if(r.area==='lair')return 0.42;return n*0.3;}   // sky areas: gentle nights; the storm always dims the peaks
/* ---- entities ---- */
function addHatchling(){
  if(ents.some(e=>e.id==='hatch'))return;
  addEnt({type:'npc',id:'hatch',name:G.sky.name||'CHICK',spr:'eaglet',x:P.x-10,y:P.y,w:10,voice:1500,solid:false,phase:0,flip:false,follow:true});
}
function makeSkyEnts(){
  const S=G.sky;
  for(const p of SKY_PADS){const a=skpA(p.at);addEnt({type:'spad',id:p.id,x:a.x,y:a.y,to:p.to?skpA(p.to):null,sq:0});}
  for(const v of SKY_VENTS){const a=skpA(v.at);addEnt({type:'svent',id:v.id,x:a.x,y:a.y,to:skpA(v.to)});}
  for(const p of SKY_PORTALS){const a=skpA(p.at);addEnt({type:'sport',id:p.id,x:a.x,y:a.y,to:p.to?skpA(p.to):null,label:p.label,lair:!!p.lair,down:p.id==='down'});}
  for(const [id,kind,o,c,r] of SKY_ITEMS){if(kind==='chime'||kind==='peg'||kind==='bolt')continue;const p=skp(o,c,r);spawnItem(id,kind,p.x,p.y);}
  for(const [c0,r0,c1,r1] of SKY_SOIL)for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)addPlot(SKO.g0[0]+c,SKO.g0[1]+r,false);
  {const g=gatePx();addEnt({type:'sgate',x:g.x,y:g.y});}
  for(const [k,o,c,r] of SKY_CHIMES){const p=skp(o,c,r);addEnt({type:'gchime',id:k,x:p.x,y:p.y,solid:true,w:12,ring:0});}
  if(S.chimes===1){const p=skp('g1',7,9);addEnt({type:'skychest',id:'chimechest',kind:'chime',x:p.x,y:p.y,solid:true,w:16});}
  if(!G.outfits.includes('scarf')){const p=skp('m1',12,8);addEnt({type:'skychest',id:'scarfchest',kind:'scarf',x:p.x,y:p.y,solid:true,w:16});}
  {const p=skp('m1',5,1);addEnt({type:'snest',x:p.x,y:p.y+2});}
  if(S.hatched)addHatchling();
  if(G.flags.sky){const p=skp('lair',8,4);addEnt({type:'npc',id:'stormy',name:'STORMY',spr:'dragon',x:p.x,y:p.y,w:44,voice:120,solid:true,phase:0,flip:false});}
}
function skyFollow(){
  const h=ents.find(e=>e.id==='hatch');if(!h||!h.follow)return;
  const p=TRAIL[Math.max(0,TRAIL.length-1-(followerCount()+1)*12)];
  if(p){if(Math.abs(p.x-h.x)>0.3)h.flip=p.x>h.x;h.x+=(p.x-h.x)*0.4;h.y+=(p.y-h.y)*0.4;}
  if(Math.hypot(h.x-P.x,h.y-P.y)>180){h.x=P.x;h.y=P.y;}
}
/* ---- per-frame ---- */
let skyCool=0,skySafe=null;
const STRIKES=[];let strikeT=60,chimeSeq=[];
function updateSky(){
  if(!G||!P||!G.sky)return;
  if(skyCool>0)skyCool--;
  skyFollow();
  // the sky gate on the snowy peak
  for(const e of ents){if(e.type!=='sgate'||!onCur(e)||state!=='play'||P.hop)continue;
    if(Math.abs(P.x-e.x)<12&&Math.abs(P.y-e.y)<12&&warpCool<=0){
      if(!G.sky.hatched){if(P.bubbleCd<=0){P.bubbleCd=240;float(e.x,e.y-26,G.flags.skyMap?'The clouds shimmer. Wait for the egg!':'A faint swirl of cloud...','#b2e7e0');}continue;}
      warpCool=80;const a=skpA(SKY_NODES.meadows.at);
      if(!G.sky.open){G.sky.open=1;save();say([{who:'me',text:"A stairway of clouds, just like the ancient map! "+(G.sky.name||'My chick')+" is tugging my wing. Let's climb!"}],()=>warpTo(a.x,a.y,3,null,()=>toast('Welcome to the CLOUD MEADOWS!','#b2e7e0')));}
      else warpTo(a.x,a.y,3,null,()=>toast('Up the cloud stairs...','#b2e7e0'));}}
  const rg=regionAt();if(!rg||!rg.sky){STRIKES.length=0;return;}
  if(P.hop&&P.hop.sky&&!P.hop.slam&&pressed.a&&has('divebomb')&&P.hop.t>6){P.hop.slam=true;SFX.gust();float(P.x,P.y-26-P.z,'DIVE!','#ffe05a');}
  const under=tileAt(Math.floor(P.x/16),Math.floor((P.y-3)/16));
  if(!P.hop&&state==='play'){
    if(under==='ε'||under==='ζ'){if(!wearing('scarf'))moveP(under==='ε'?0.9:-0.9,0,false);else if(tick%120===0)float(P.x,P.y-24,'Cozy scarf!','#ff9cd0');}
    if(under==='ι'&&!wearing('stormcap')&&P.inv<=0){hurt({x:P.x,y:P.y});if(skySafe){P.x=skySafe.x;P.y=skySafe.y;}float(P.x,P.y-24,'Brrr! Rain wall!','#a6c8ff');}
    else if(under!=='ι'&&under!=='ε'&&under!=='ζ')skySafe={x:P.x,y:P.y};
  }
  if(state==='play')for(const e of ents){if(!onCur(e))continue;
    if(P.hop)break;
    const near=Math.abs(P.x-e.x)<9&&Math.abs(P.y-e.y)<9;
    if(e.type==='spad'&&near&&skyCool<=0)skyLaunch(e);
    else if(e.type==='svent'&&near&&skyCool<=0)ventUse(e);
    else if(e.type==='sport'&&warpCool<=0&&Math.abs(P.x-e.x)<10&&Math.abs(P.y-e.y)<10)portalUse(e);}
  for(const e of ents)if(e.sq>0)e.sq--;
  updateStorm();
  if(skyBossActive())updateSkyBoss();
}
function skyLaunch(e){
  const q=wearing('quill'),to=e.to||{x:e.x,y:e.y};
  P.x=e.x;P.y=e.y;P.hop={x0:P.x,y0:P.y,x1:to.x,y1:to.y,t:0,d:Math.round((e.to?40:46)*(q?0.8:1)),hz:e.to?34:44,sky:true};skyCool=P.hop.d+30;   // time to walk off the cloud before it bounces again
  e.sq=10;SFX.hop();puff(e.x,e.y-4,8,['#ffffff','#e6f2ff'],1.4,0.05);
  if(!e.to&&has('divebomb')&&!G.sky.dbTip){G.sky.dbTip=1;toast('Press peck in mid-air to DIVE-BOMB!','#ffe05a');}
}
function ventUse(e){
  if(!has('updraft')){skyCool=120;float(e.x,e.y-26,'Strong wind! Learn UPDRAFT.','#b2e7e0');SFX.deny();return;}
  P.x=e.x;P.y=e.y;P.hop={x0:P.x,y0:P.y,x1:e.to.x,y1:e.to.y,t:0,d:Math.round(46*(wearing('quill')?0.8:1)),hz:46,sky:true};skyCool=P.hop.d+30;
  SFX.gust();puff(e.x,e.y-6,10,['#ffffff','#b2e7e0'],1.2,-0.04);
}
function portalUse(e){
  if(e.down){warpCool=80;const o=gateOut();warpTo(o.x,o.y,0,null,()=>toast('Down the cloud stairs...','#b2e7e0'));return;}
  if(e.id==='p1lair'&&G.sky.boss<4){warpCool=80;warpTo(e.to.x,e.to.y,1,null,()=>skyBossStart());return;}
  if(e.id==='lairp1'){SKB=null;ents=ents.filter(x=>!['sdragon','scrys','sbell'].includes(x.type));STRIKES.length=0;}
  warpCool=80;warpTo(e.to.x,e.to.y,e.to.x>e.x?3:2,null,null);
}
function skyLand(h){
  if(!h.slam)return;
  shake=7;SFX.brk();
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;parts.push({x:P.x,y:P.y-2,vx:Math.cos(a)*2.2,vy:Math.sin(a)*1.2,g:0,life:18,c:i%2?'#ffffff':'#ffe05a'});}
  let n=0;const c0=Math.floor(P.x/16),r0=Math.floor((P.y-3)/16);
  for(let dr=-3;dr<=3;dr++)for(let dc=-3;dc<=3;dc++){const c=c0+dc,r=r0+dr;
    if(tileAt(c,r)==='κ'&&Math.hypot(c*16+8-P.x,r*16+8-(P.y-3))<=44){setTile(c,r,'α');n++;puff(c*16+8,r*16+8,10,['#ffffff','#a8b4c8'],1.6,0.06);}}
  for(const e of ents)if(e.type==='sbell'&&!e.rung&&Math.hypot(e.x-P.x,e.y-P.y)<26)ringBell(e);
  if(n){toast('SLAM! The cloud barrier cracks!','#ffe05a');save();}
}
function skyBump(ix,iy){
  if(!skyRegion()||P.bubbleCd>0)return false;
  const [dx,dy]=[ix?Math.sign(ix):0,iy?Math.sign(iy):0],t=tileAt(Math.floor((P.x+dx*9)/16),Math.floor((P.y-3+dy*7)/16));
  const msg={γ:"This cloud is too thin to stand on... Cloud Walk could do it!",κ:"A cloud barrier! Something heavy, falling from above, might crack it.",θ:"A storm crystal, buzzing with lightning!",η:null}[t];
  if(msg){P.bubbleCd=200;float(P.x,P.y-26,msg.length>34?msg.slice(0,msg.lastIndexOf(' ',34))+'...':msg,'#b2e7e0');return true;}
  return false;
}
/* ---- storms ---- */
function spawnStrike(x,y,warn){
  const c=Math.floor(x/16),r=Math.floor((y-3)/16),t=tileAt(c,r);if(t!=='α'&&t!=='ε'&&t!=='ζ')return;
  STRIKES.push({x:c*16+8,y:r*16+12,t:0,warn:(warn||56)+(wearing('stormcap')?24:0)});
}
function updateStorm(){
  if(skyArea()==='peaks'&&state==='play'&&--strikeT<=0){strikeT=110+Math.random()*100;spawnStrike(P.x+(Math.random()-.5)*130,P.y+(Math.random()-.5)*100);}
  for(const s of STRIKES){s.t++;
    if(s.t===s.warn){SFX.thunder();flash=Math.max(flash,0.6);shake=5;
      if(Math.hypot(P.x-s.x,P.y-6-(s.y-8))<16&&!P.hop)hurt({x:s.x,y:s.y});}}
  for(let i=STRIKES.length-1;i>=0;i--)if(STRIKES[i].t>STRIKES[i].warn+14)STRIKES.splice(i,1);
}
/* ---- peck hooks ---- */
function skyPeck(e,f,pr){
  if(e.type==='gchime'&&Math.abs(e.x-f.x)<14&&Math.abs(e.y-8-f.y)<14){ringChime(e);return true;}
  if(e.type==='skychest'&&Math.abs(e.x-f.x)<16&&Math.abs(e.y-6-f.y)<16){openSkyChest(e);return true;}
  if(e.type==='snest'&&Math.abs(e.x-f.x)<14&&Math.abs(e.y-4-f.y)<14){peckNest(e);return true;}
  if(e.type==='sbell'&&Math.abs(e.x-f.x)<16&&Math.abs(e.y-8-f.y)<16){ringBell(e);return true;}
  if(e.type==='scrys'&&Math.abs(e.x-f.x)<16&&Math.abs(e.y-8-f.y)<16){hitCrystal(e);return true;}
  return false;
}
function skyTalkChest(f){for(const e of ents)if(e.type==='skychest'&&Math.abs(e.x-f.x)<16&&Math.abs(e.y-6-f.y)<16){openSkyChest(e);return true;}return false;}
function smashCrystal(c,r){
  setTile(c,r,'α');SFX.brk();shake=6;puff(c*16+8,r*16+8,16,['#c898f8','#8a4ad8','#ffe84a','#ffffff'],1.8,0.06);
  if(!G.sky.crys)toast('The storm crystal shatters! A gap in the wall!','#c898f8');G.sky.crys=(G.sky.crys||0)+1;save();
}
function ringChime(e){
  e.ring=20;SFX.blip({small:980,mid:720,big:470}[e.id]);
  if(G.sky.chimes>=1){float(e.x,e.y-20,'The garden hums...','#a1d970');return;}
  chimeSeq.push(e.id);
  if(chimeSeq.some((k,i)=>k!==CHIME_TUNE[i])){chimeSeq=[];SFX.deny();float(e.x,e.y-20,'...off-key. Try again!','#b9d1dd');return;}
  float(e.x,e.y-20,chimeSeq.length+'/3','#ffe05a');
  if(chimeSeq.length>=3){chimeSeq=[];G.sky.chimes=1;SFX.fanfare();shake=4;toast('The chimes sing! A chest appears!','#ff9cd0');
    const p=skp('g1',7,9);addEnt({type:'skychest',id:'chimechest',kind:'chime',x:p.x,y:p.y,solid:true,w:16});puff(p.x,p.y-8,16,['#ffe05a','#fff8ec','#ff9cd0'],1.8,0.04);save();}
}
function openSkyChest(e){
  if(e.kind==='chime'){e.dead=true;G.sky.chimes=2;SFX.chest();shake=3;G.sacks.star=(G.sacks.star||0)+3;addSeeds(4,2,0);
    toast('3 STAR-FRUIT seeds and 4 seeds!','#ffe05a');say([{who:'me',text:"The garden chest held star-fruit seeds and a few seeds! Time to plant."}]);}
  else if(e.kind==='scarf'){e.dead=true;SFX.chest();shake=5;
    if(grantOutfit('scarf'))toast('Found the CLOUD SCARF!','#ff9cd0');say([{who:'me',text:"A hidden pocket in the clouds, and a CLOUD SCARF inside! Press C to wear it."}]);}
  save();
}
function peckNest(e){
  if(G.sky.nest){float(e.x,e.y-16,'An empty old nest.','#b9d1dd');SFX.clunk();return;}
  G.sky.nest=1;SFX.chirp();puff(e.x,e.y-6,12,['#b69965','#fff8ec','#ffe05a'],1.4,0.05);addSeeds(3,2,0);secretFound('skynest');
  say([{who:'me',text:"The last cloud of the island! A tiny, ancient nest, and three seeds tucked inside."}]);save();
}
/* ---- hatching ---- */
let HAT=null,NAMEUI=null;
function startHatch(){HAT={t:0};state='hatch';fade=0;SFX.magic();}
function updateHatch(){
  const h=HAT;h.t++;
  if(h.t<150&&h.t%24===0)SFX.clunk();
  if(h.t===150){SFX.crackEgg();shake=4;}
  if(h.t===195){SFX.catchEgg();shake=3;}
  if(h.t===230)SFX.chirp();
  if(h.t>290&&pressed.a){SFX.menu();openNaming();}
  updateAmbient();
}
function drawHatch(){
  const h=HAT,t=h.t;
  drawSky(tick);ctx.fillStyle='#fff8ec';ctx.fillRect(0,150,W,H-150);ctx.fillStyle='#d8eefc';ctx.fillRect(0,150,W,2);
  for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#e6f2ff':'#ffffff';ctx.fillRect(i*22-6,146+(i%3)*2,26,6);}
  const el=SPR.eagle;ctx.drawImage(el,34,170-el.height*2,el.width*2,el.height*2);
  drawPip(stageOfRank(G.rank),3,Math.floor(tick/14)%2,false,210,184,2);
  const cx=128,cy=168;
  if(t<195){const w=t<150?Math.sin(t/4)*Math.min(14,t/8):0,e=SPR.eagleEgg;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(w*0.03);ctx.drawImage(e,-e.width*3,-e.height*6,e.width*6,e.height*6);
    if(t>=150){ctx.fillStyle='#202840';ctx.fillRect(-4,-22,2,10);ctx.fillRect(-2,-14,6,2);ctx.fillRect(2,-12,2,8);}
    ctx.restore();}
  else{const e=SPR.eaglet,k=Math.min(1,(t-195)/20);
    ctx.fillStyle='#fff8ec';ctx.fillRect(cx-22,cy-8,16,10);ctx.fillRect(cx+8,cy-8,16,10);ctx.fillStyle='#202840';ctx.fillRect(cx-22,cy-9,16,2);ctx.fillRect(cx+8,cy-9,16,2);
    ctx.drawImage(e,Math.round(cx-e.width*2*k),Math.round(cy-e.height*4*k-Math.sin(t/6)*1.5),Math.round(e.width*4*k),Math.round(e.height*4*k));
    if(t%5===0)parts.push({x:cx-12+Math.random()*24+camX,y:cy-30+camY,vx:(Math.random()-.5)*1.5,vy:-0.8-Math.random(),g:0.02,life:30,c:['#ffe05a','#fff8ec','#ff6fae'][(Math.random()*3)|0]});}
  for(const p of parts){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x-camX),Math.round(p.y-camY),2,2);}
  const msg=t<150?'The egg is wobbling...':t<195?'Crack... crack...':t<290?'A tiny eaglet blinks up at you!':'Press Z';
  box(40,16,176,22,'#fff8ec','#202840');txt(msg,W/2,23,7,'#202840',{align:'center'});
}
const NAME_ROWS=[['SKY','NIMBLE','PEEPER','ZIPPY'],'ABCDEFG'.split(''),'HIJKLMN'.split(''),'OPQRSTU'.split(''),['V','W','X','Y','Z','DEL','OK']];
function openNaming(){NAMEUI={s:'',row:0,col:0};state='naming';HAT=null;}
function updateNaming(){
  const N=NAMEUI;
  if(pressed.up){N.row=(N.row+NAME_ROWS.length-1)%NAME_ROWS.length;SFX.menu();}
  if(pressed.down){N.row=(N.row+1)%NAME_ROWS.length;SFX.menu();}
  if(pressed.left){N.col--;SFX.menu();}if(pressed.right){N.col++;SFX.menu();}
  const rl=NAME_ROWS[N.row].length;N.col=((N.col%rl)+rl)%rl;
  if(pressed.b||pressed.back){N.s=N.s.slice(0,-1);SFX.menu();}
  if(pressed.a){const k=NAME_ROWS[N.row][N.col];
    if(N.row===0){N.s=k;SFX.pick();}
    else if(k==='DEL'){N.s=N.s.slice(0,-1);SFX.menu();}
    else if(k==='OK'){if(N.s.length>0)finishNaming();else{SFX.deny();}}
    else if(N.s.length<10){N.s+=k;SFX.pick();}else SFX.deny();}
  updateAmbient();
}
function drawNaming(){
  const N=NAMEUI;ctx.fillStyle='#24364a';ctx.fillRect(0,0,W,H);
  for(let i=0;i<30;i++){ctx.fillStyle=(i+Math.floor(tick/12))%4?'#29465b':'#ffe05a';ctx.fillRect((i*53)%W,(i*37+Math.floor(tick/4))%H,1,1);}
  box(10,8,W-20,H-16,'#192639','#ffe05a');txt('NAME YOUR CHICK!',W/2,14,9,'#ffe05a',{align:'center',shadow:true});
  const e=SPR.eaglet;ctx.drawImage(e,Math.round(W/2-e.width*1.5),32,e.width*3,e.height*3);
  box(54,64,148,18,'#fff8ec','#202840');let nm=N.s;if(Math.floor(tick/20)%2&&N.s.length<10)nm+='_';txt(nm,W/2,70,9,'#202840',{align:'center'});
  NAME_ROWS.forEach((row,ri)=>{const y=ri===0?90:106+(ri-1)*17,n=row.length,cw=ri===0?42:ri===4?(ri===4?30:26):26;
    const total=ri===0?4*44:n*28,x0=Math.round((W-total)/2);
    row.forEach((k,ci)=>{const w=ri===0?42:26,x=ri===0?x0+ci*44:x0+ci*28,sel=ri===N.row&&ci===N.col;
      box(x,y,w,ri===0?13:15,sel?'#ffe05a':'#29465b',sel?'#fff8ec':'#7896ae');
      txt(k,x+w/2,y+(ri===0?4:5),ri===0?5:6,sel?'#202840':(k==='OK'?'#a1d970':k==='DEL'?'#ff8080':'#fff8ec'),{align:'center'});});});
  txt('Z: pick     X: erase',W/2,H-22,5,'#b9d1dd',{align:'center'});
}
function finishNaming(){
  const name=NAMEUI.s;NAMEUI=null;state='play';G.sky.name=name;G.sky.hatched=1;
  const h=ents.find(e=>e.id==='hatch');if(h)h.name=name;else addHatchling();
  const hh=ents.find(e=>e.id==='hatch');if(hh)hh.name=name;
  SFX.fanfare();reward(QUESTS.sk_hatch.reward,'sk_hatch');
  const el=ents.find(e=>e.id==='elda');
  say([{who:el||'me',text:name+"! What a fine, strong name. Screeee!"},
    {who:el||'me',text:"The old map shows a stairway of clouds just east of my nest. "+name+" belongs up there, in the sky, and so do you."},
    {who:'me',text:"A cloud stairway! Come on, "+name+"! Let's see the Sky Kingdom!"}],()=>{toast('A cloud stairway shimmers east of Elda!','#b2e7e0');save();});
}
/* ---- quest marker and hint for the sky ---- */
function skyHint(){
  if(!G.flags.skyMap)return null;
  if(!G.sky.hatched)return "Elda's egg is about to hatch! Visit her on the snowy peak.";
  if(!G.sky.open)return "A cloud stairway shimmers just east of Elda's nest on the snowy peak. Take your chick up!";
  for(const id of ORDER6)if(G.q[id]===1&&QUESTS[id].check())return "Go tell "+NAMES[QUEST_GIVER[id]]+" the good news!";
  for(const k in TRAIN){const t=TRAIN[k];if(t.phase===6&&G.train[k]===1)return t.hint();}
  for(const id of ORDER6)if(G.q[id]===1)return QUESTS[id].hint();

/* ---------------- growth tree ---------------- */
let growPage=0;
const TREE=()=>growPage===1?SKILLS2:growPage===3?SKILLS3:growPage===4?SKILLS4:growPage===5?SKILLS5:SKILLS;
function growPages(){return [0,...(G.part2?[1]:[]),...((G.vil.open||G.q.vfound>=1)?[3]:[]),...(G.sea.open?[4]:[]),...(G.sky.open?[5]:[]),2];}
function openGrow(){state='grow';SFX.menu();growMsg=null;growPage=G.part2?1:0;growSel=0;const i=TREE().findIndex(s=>!has(s.id)&&s.req.every(has));if(i>=0)growSel=i;}
function skillState(s){if(has(s.id))return'learned';if(!s.req.every(has))return'locked';if(TRAIN[s.id]&&G.train[s.id]!==2)return'train';return'open';}
function updateGrow(){
  if(lvlAnim>0)lvlAnim--;
  if(pressed.grow||pressed.back||pressed.quest){state='play';SFX.menu();return;}
  if(pressed.b){const pg=growPages();growPage=pg[(pg.indexOf(growPage)+1)%pg.length];growSel=0;growMsg=null;SFX.menu();return;}
  if(growPage===2){if(pressed.a||pressed.left||pressed.right){jpage^=1;SFX.menu();}return;}
  const SKILLS=TREE();
  const cur=SKILLS[growSel];
  const dirs=[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]];
  for(const [k,dx,dy] of dirs){if(!pressed[k])continue;
    let best=-1,bs=1e9;SKILLS.forEach((s,i)=>{if(i===growSel)return;const vx=s.x-cur.x,vy=s.y-cur.y;const along=vx*dx+vy*dy;if(along<=0)return;
      const perp=Math.abs(vx*dy-vy*dx);const sc=along+perp*2;if(sc<bs){bs=sc;best=i;}});
    if(best>=0){growSel=best;growMsg=null;SFX.menu();}}
  if(pressed.a){
    const st=skillState(cur);
    if(st==='learned'){growMsg={s:'Already learned!',c:'#a1d970'};SFX.deny();}
    else if(st==='locked'){growMsg={s:'Learn '+cur.req.filter(r=>!has(r)).map(r=>SKILLS.find(x=>x.id===r).name).join(' & ')+' first!',c:'#ff8080'};SFX.deny();}
    else if(st==='train'){growMsg={s:trainMsg(cur.id),c:'#ff9cd0'};SFX.deny();}
    else if(G.seeds<cur.cost){growMsg={s:'You need '+(cur.cost-G.seeds)+' more seed'+(cur.cost-G.seeds>1?'s':'')+'. Help the animals!',c:'#ff8080'};SFX.deny();}
    else{G.seeds-=cur.cost;G.skills.add(cur.id);gainGP(GP.skill);G.hearts=maxHearts();lvlAnim=110;SFX.lvl();growMsg={s:cur.learn,c:'#ffe05a'};toast(cur.name+': '+cur.learn);save();}
  }
}

let pauseSel=0,pauseMode='menu',eraseSel=1;

function updatePause(){
  if(pauseMode==='controls'){if(pressed.a||pressed.back||pressed.b||pressed.pause){pauseMode='menu';SFX.menu();}return;}
  if(pauseMode==='erase'){
    if(pressed.up||pressed.down||pressed.left||pressed.right){eraseSel^=1;SFX.menu();}
    if(pressed.back||pressed.b||pressed.pause){pauseMode='menu';SFX.menu();}
    else if(pressed.a){SFX.pick();pauseMode='menu';if(eraseSel===0)eraseSave();}
    return;}
  if(pressed.back||pressed.pause){state='play';SFX.menu();return;}
  if(pressed.up){pauseSel=(pauseSel+PAUSE_ROWS.length-1)%PAUSE_ROWS.length;SFX.menu();}
  if(pressed.down){pauseSel=(pauseSel+1)%PAUSE_ROWS.length;SFX.menu();}
  const d=(pressed.right?1:0)-(pressed.left?1:0),a=pressed.a;
  switch(pauseSel){
    case 0:if(a){state='play';SFX.menu();}break;
    case 1:if(a){pauseMode='controls';SFX.menu();}break;
    case 2:if(d||a){SET.music=a&&!d?(SET.music>=10?0:SET.music+1):clamp(SET.music+d,0,10);applyVolumes();saveSettings();SFX.menu();}break;

function MINIMAP_BEYOND(){
  const sea=seaRegion()?'sea':skyRegion()?'sky':'ground';if(!_mmCache)_mmCache={};if(_mmCache[sea])return _mmCache[sea];
  const cells=REGION_LIST.filter(r=>r.beyond&&r.area&&(r.sea?'sea':r.sky?'sky':'ground')===sea).flatMap(r=>r.cells);
  const xs=cells.map(c=>c.sx),ys=cells.map(c=>c.sy),x0=Math.min(...xs),y0=Math.min(...ys);
  return _mmCache[sea]={cells,x0,y0,cols:Math.max(...xs)-x0+1,rows:Math.max(...ys)-y0+1};
}

/* ===== src/main.js ===== */
/* ---------------- loop ---------------- */
function update(){
  tick++;
  if(pressed.mute){musicOn=!musicOn;applyVolumes();if(G&&state!=='title')toast(musicOn?'Music on':'Music off','#b2e7e0');}
  if(fade>0&&(state==='play'||state==='title')&&!trans){fade=Math.max(0,fade-0.04);}
  if(G&&(state==='play'||state==='talk'||state==='warp'))updateEnv();
  wantTrack=state==='title'?'farm':state==='egg'?'mini':G?pickTrack():'farm';
  switch(state){
    case 'title':updateTitle();break;
    case 'play':G.time++;updatePlay();break;
    case 'talk':G.time++;updateTalk();updateAmbient();break;
    case 'wardrobe':updateWardrobe();break;
    case 'egg':updateEgg();break;
    case 'sleep':updateSleep();break;
    case 'pause':updatePause();break;
    case 'rankup':updateRankUp();break;
    case 'catalog':updateCatalog();break;
    case 'plant':updatePlant();break;
    case 'festival':updateFestival();break;
    case 'pinch':updatePinch();break;
    case 'sail':updateSail();break;
    case 'voyage':updateVoyage();break;
    case 'chase':updateChase();break;
    case 'credits':updateCredits();break;
    case 'hatch':updateHatch();break;
    case 'naming':updateNaming();break;
    case 'flyover':updateFlyover();break;
    case 'grow':updateGrow();updateAmbient();break;
    case 'quests':if(questPage===4){if(pressed.down){sleuthTop++;SFX.menu();}if(pressed.up){sleuthTop=Math.max(0,sleuthTop-1);SFX.menu();}}
      if(pressed.b){{const pg=questPages();questPage=pg[(pg.indexOf(questPage)+1)%pg.length];}SFX.menu();}else if(pressed.quest||pressed.back||pressed.a||pressed.grow){state='play';SFX.menu();}break;
    case 'map':updateMap();break;
    case 'flying':updateFlying();break;
    case 'p2intro':updateP2Intro();break;
    case 'faint':updateFaint();updateAmbient();break;
    case 'warp':updateWarp();updateAmbient();break;
    case 'ending':updateEnding();break;
  }
  for(const k in pressed)pressed[k]=false;
}
let last=performance.now(),acc=0;
function frame(now){
  const dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.floor(innerWidth*dpr)||cv.height!==Math.floor(innerHeight*dpr))resize();
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){update();acc-=1000/60;}
  if(tick%10===0)updateTouchUI();
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
