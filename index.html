<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0814">
<title>Chicklandia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0814;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  #touch{display:none;position:fixed;inset:0;pointer-events:none;font-family:"Press Start 2P",monospace;-webkit-touch-callout:none}
  #touch.on{display:block}
  #touch button{pointer-events:auto;position:absolute;border:3px solid #21142b;background:rgba(255,248,236,.62);color:#21142b;font:inherit;
    border-radius:12px;touch-action:none;padding:0;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  #touch button.down{background:rgba(255,216,58,.92);transform:scale(.94)}
  #touch .act{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
  #touch .act b{font-size:20px;font-weight:normal}
  #touch .act small{font-size:7px}
  #btnA{background:rgba(255,150,150,.75)!important}
  #btnA.down,#btnB.down{background:rgba(255,216,58,.92)!important}
  #dpad{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(255,248,236,.10)}
  #dpad .arm{position:absolute;background:rgba(255,248,236,.62);border:3px solid #21142b;box-sizing:border-box;color:#21142b;
    display:flex;align-items:center;justify-content:center;font-size:12px}
  #dpad .u,#dpad .d{left:33%;width:34%;height:39%}
  #dpad .u{top:0;border-radius:10px 10px 0 0}
  #dpad .d{bottom:0;border-radius:0 0 10px 10px}
  #dpad .l,#dpad .r{top:33%;height:34%;width:39%}
  #dpad .l{left:0;border-radius:10px 0 0 10px}
  #dpad .r{right:0;border-radius:0 10px 10px 0}
  #dpad .hub{position:absolute;left:31%;top:31%;width:38%;height:38%;background:rgba(255,248,236,.62)}
  #dpad .on{background:rgba(255,216,58,.92)}
  #menu{position:absolute;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
  #menu button{position:static;pointer-events:auto;font-size:7px;min-width:44px;height:34px;padding:0 6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div id="dpad"><div class="arm u">&#9650;</div><div class="arm d">&#9660;</div><div class="arm l">&#9664;</div><div class="arm r">&#9654;</div><div class="hub"></div></div>
  <button class="act" id="btnA" data-k="a"><b>A</b><small>PECK</small></button>
  <button class="act" id="btnB" data-k="b"><b>B</b><small>FLAP</small></button>
  <div id="menu">
    <button data-k="grow">GROW</button><button data-k="quest">QUESTS</button><button data-k="wear">OUTFIT</button><button data-k="fly" id="btnMap">MAP</button>
    <button data-k="back">&#10005;</button><button data-k="mute">&#9835;</button><button data-k="full" id="btnFull">&#9974;</button>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   CHICKLANDIA - a tiny chick's big dream
   ===================================================================== */
const W=256,H=224,HUD=32,TS=16,VW=256,VH=192,MW=48,MH=84,TOTAL_SEEDS=45,DAY=18000;
const FONT='"Press Start 2P", monospace';
const SAVE_KEY='chicklandia_save_v2';

const cv=document.getElementById('c'),dctx=cv.getContext('2d');
const pix=document.createElement('canvas');pix.width=W;pix.height=H;
const ctx=pix.getContext('2d');ctx.imageSmoothingEnabled=false;
let K=1,OX=0,OY=0,TOUCH=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
function resize(){
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.floor(innerWidth*dpr);cv.height=Math.floor(innerHeight*dpr);
  const portrait=TOUCH&&innerHeight>innerWidth;            // phones held upright: game on top, controls below
  let k=Math.min(cv.width/W,(portrait?cv.height*0.58:cv.height)/H);if(k>=2&&!TOUCH)k=Math.floor(k);
  K=k;OX=Math.floor((cv.width-W*K)/2);OY=portrait?Math.floor(10*dpr):Math.floor((cv.height-H*K)/2);
  layoutTouch();
}
function layoutTouch(){
  const T=document.getElementById('touch');if(!T)return;T.classList.toggle('on',TOUCH);if(!TOUCH)return;
  const dpr=window.devicePixelRatio||1,vw=innerWidth,vh=innerHeight,gx=OX/dpr,gy=OY/dpr,gh=H*K/dpr;
  const S=(id,o)=>{const el=document.getElementById(id);for(const k in o)el.style[k]=typeof o[k]==='number'?o[k]+'px':o[k];};
  const safe=v=>'calc('+v+'px + env(safe-area-inset-bottom))';
  if(vh>vw){
    const top=gy+gh+10,area=vh-top;
    S('menu',{left:'8px',right:'8px',top,justifyContent:'center'});
    const pad=Math.max(110,Math.min(180,area-90,vw*0.46));
    S('dpad',{left:'14px',bottom:safe(16),width:pad,height:pad});
    const a=Math.min(88,pad*0.56),b=Math.round(a*0.78);
    S('btnA',{right:'16px',left:'auto',bottom:safe(16+pad*0.42),width:a,height:a});
    S('btnB',{right:(24+a)+'px',left:'auto',bottom:safe(14),width:b,height:b});
  }else{
    const bar=gx,big=bar>=130;
    const pad=Math.min(big?bar-24:150,vh*0.48,170);
    S('dpad',{left:(big?(bar-pad)/2:14)+'px',bottom:safe(18),width:pad,height:pad});
    const a=Math.min(84,big?bar*0.46:78),b=Math.round(a*0.78);
    S('btnA',{right:(big?(bar-a)/2:16)+'px',left:'auto',bottom:safe(24+b),width:a,height:a});
    S('btnB',{right:(big?Math.max(6,(bar-a)/2-b*0.35):24+a)+'px',left:'auto',bottom:safe(12),width:b,height:b});
    if(big)S('menu',{left:(vw-bar+8)+'px',right:'8px',top:'8px',justifyContent:'center'});
    else S('menu',{left:'8px',right:'8px',top:'6px',justifyContent:'flex-end'});
  }
}
addEventListener('resize',resize);resize();

/* ---------------- palette & helpers ---------------- */
const PAL={k:'#21142b',w:'#fff8ec',y:'#ffd83a',Y:'#e8a422',o:'#f37d22',r:'#e03838',R:'#962430',
  p:'#f6a6b6',P:'#d06f8a',b:'#9a6234',B:'#5e3a1c',g:'#5cb84c',G:'#2f7d3a',l:'#94dc64',u:'#3a86e8',
  U:'#1f55a8',c:'#a6e0ff',e:'#a8a8b8',E:'#62627a',t:'#ecd09a',T:'#c49a5c',n:'#f6ead0',f:'#ec6c24',
  q:'#ffd21e',Q:'#c98a00',m:'#7a5230'};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0;}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x);return c;}
function P_(x,col,i,j,w=1,h=1){x.fillStyle=PAL[col]||col;x.fillRect(i,j,w,h);}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function makeSprite(rows,outline=true){
  const pad=outline?1:0,h=rows.length,w=Math.max(...rows.map(r=>r.length));
  return mk(w+pad*2,h+pad*2,x=>{
    const filled=(i,j)=>{if(j<0||j>=h)return false;const ch=rows[j][i];return !!ch&&ch!=='.'&&ch!==' ';};
    if(outline){x.fillStyle=PAL.k;
      for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(filled(i,j))continue;
        if(filled(i-1,j)||filled(i+1,j)||filled(i,j-1)||filled(i,j+1))x.fillRect(i+pad,j+pad,1,1);}}
    for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(ch==='.'||ch===' ')continue;
      x.fillStyle=PAL[ch]||'#f0f';x.fillRect(i+pad,j+pad,1,1);}
  });
}
const flipMap=new WeakMap();
function flipOf(c){let f=flipMap.get(c);if(f)return f;
  f=mk(c.width,c.height,x=>{x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);});flipMap.set(c,f);return f;}

/* ---------------- tiles ---------------- */
const TILE={};
function grassBase(x,seed){P_(x,'g',0,0,16,16);const r=mulberry(seed);
  for(let n=0;n<6;n++){const i=(r()*15)|0,j=(r()*14)|0;P_(x,'G',i,j+1);P_(x,'G',i+1,j);}
  for(let n=0;n<3;n++)P_(x,'l',(r()*16)|0,(r()*16)|0);}
function blob(x,cx,cy,rx,ry,fn){for(let j=0;j<16;j++)for(let i=0;i<16;i++){const dx=(i+.5-cx)/rx,dy=(j+.5-cy)/ry,d=dx*dx+dy*dy;if(d<1){const c=fn(d,dx,dy,i,j);if(c)P_(x,c,i,j);}}}
TILE.grass=[0,1,2].map(s=>mk(16,16,x=>grassBase(x,s*99+7)));
TILE.flower=[0,1].map(s=>mk(16,16,x=>{grassBase(x,s+50);const r=mulberry(s+3);
  for(let n=0;n<2;n++){const i=(3+r()*10)|0,j=(3+r()*10)|0;const pc=(n===1&&s===1)?'p':'w';
    P_(x,pc,i-1,j);P_(x,pc,i+1,j);P_(x,pc,i,j-1);P_(x,pc,i,j+1);P_(x,'y',i,j);}}));
TILE.dirt=mk(16,16,x=>{P_(x,'t',0,0,16,16);const r=mulberry(11);for(let n=0;n<10;n++)P_(x,'T',(r()*16)|0,(r()*16)|0);for(let n=0;n<3;n++)P_(x,'n',(r()*16)|0,(r()*16)|0);});
TILE.patch=mk(16,16,x=>{grassBase(x,17);blob(x,8,8,7.5,6.8,(d,dx,dy,i,j)=>d>0.8?'B':((i*7+j*3)%5===0?'m':'b'));});
TILE.mud=mk(16,16,x=>{P_(x,'b',0,0,16,16);const r=mulberry(5);for(let n=0;n<8;n++)P_(x,'B',(r()*15)|0,(r()*15)|0,2,1);P_(x,'T',4,5);P_(x,'T',11,10);});
TILE.water=[0,1].map(f=>mk(16,16,x=>{P_(x,'u',0,0,16,16);const r=mulberry(77);
  for(let n=0;n<4;n++){const i=(r()*12)|0,j=(r()*14)|0,o=f?2:0;P_(x,'c',(i+o)%14,j,3,1);P_(x,'U',(i+o+1)%14,j+1,2,1);}}));
TILE.reeds=mk(16,16,x=>{grassBase(x,31);[[3,5],[6,3],[9,6],[12,4]].forEach(([i,j])=>{P_(x,'G',i,j,1,16-j);P_(x,'B',i,j-3,1,3);});P_(x,'l',4,9,1,6);P_(x,'l',10,10,1,5);});
TILE.fenceH=mk(16,16,x=>{grassBase(x,13);
  for(const y of [4,9]){P_(x,'k',0,y-1,16,1);P_(x,'T',0,y,16,1);P_(x,'b',0,y+1,16,1);P_(x,'k',0,y+2,16,1);}
  P_(x,'k',5,1,6,14);P_(x,'T',6,2,4,1);P_(x,'b',6,3,4,11);P_(x,'B',9,3,1,11);P_(x,'G',5,15,6,1);});
TILE.fenceV=mk(16,16,x=>{grassBase(x,13);P_(x,'k',6,0,4,16);P_(x,'T',7,0,1,16);P_(x,'b',8,0,1,16);
  P_(x,'k',4,3,8,10);P_(x,'T',5,4,6,1);P_(x,'b',5,5,6,7);P_(x,'B',10,5,1,7);P_(x,'G',4,13,8,2);});
TILE.tall=mk(16,16,x=>{P_(x,'B',0,0,16,16);for(let i=0;i<16;i+=4){P_(x,'b',i,0,3,16);P_(x,'T',i,0,1,16);P_(x,'k',i+3,0,1,16);}
  P_(x,'k',0,5,16,1);P_(x,'m',0,6,16,2);P_(x,'k',0,8,16,1);});
function treeTile(x,apples){grassBase(x,21);P_(x,'G',2,13,12,2);P_(x,'k',6,10,4,6);P_(x,'B',7,10,2,5);
  blob(x,8,6.5,7.8,6.6,(d,dx,dy)=>{if(d>0.84)return'k';if(dx<-0.3&&dy<-0.35&&d<0.45)return'l';if(dx<0.1&&dy<0.1&&d<0.62)return'g';return'G';});
  if(apples)[[4,4],[10,3],[8,8],[11,8],[4,8]].forEach(([i,j])=>{P_(x,'r',i,j,2,2);P_(x,'w',i,j);});}
TILE.tree=mk(16,16,x=>treeTile(x,false));
TILE.apple=mk(16,16,x=>treeTile(x,true));
TILE.bush=mk(16,16,x=>{grassBase(x,41);P_(x,'G',2,13,12,2);
  blob(x,8,8.5,7.6,6.6,(d,dx,dy,i,j)=>{if(d>0.8)return'k';if(dx<-0.1&&dy<-0.2&&d<0.5)return'l';return((i+j*3)%7===0)?'G':'g';});});
TILE.hay=mk(16,16,x=>{grassBase(x,51);P_(x,'k',1,2,14,13);P_(x,'y',2,3,12,10);P_(x,'Y',2,10,12,3);
  for(let i=4;i<13;i+=3)P_(x,'Q',i,4,1,7);P_(x,'B',2,7,12,1);P_(x,'w',3,3,4,1);});
TILE.rock=mk(16,16,x=>{grassBase(x,61);P_(x,'G',2,13,13,2);
  blob(x,8,8.5,7.4,6.8,(d,dx,dy)=>{if(d>0.75)return'k';if(dy>0.35)return'E';if(dx<-0.2&&dy<-0.2&&d<0.4)return'n';return'e';});
  P_(x,'k',7,4,1,3);P_(x,'k',8,7,1,2);P_(x,'k',9,9,1,2);P_(x,'k',6,7,1,1);});
TILE.crate=mk(16,16,x=>{grassBase(x,71);P_(x,'k',1,2,14,13);P_(x,'b',2,3,12,11);P_(x,'B',2,12,12,2);P_(x,'T',2,3,12,1);
  for(let k=0;k<8;k++){P_(x,'T',4+k,4+k);P_(x,'T',11-k,4+k);}P_(x,'B',2,3,1,11);P_(x,'B',13,3,1,11);});
TILE.leaves=mk(16,16,x=>{grassBase(x,81);const r=mulberry(9);const cs=['f','r','Q','o','b','f'];
  blob(x,8,10,7.8,6,(d,dx,dy,i,j)=>j<4?null:(d>0.8?'B':cs[(r()*6)|0]));});
TILE.sign=mk(16,16,x=>{grassBase(x,91);P_(x,'k',7,8,3,7);P_(x,'B',8,8,1,6);P_(x,'k',1,2,14,8);P_(x,'t',2,3,12,6);P_(x,'T',3,4,9,1);P_(x,'T',3,6,7,1);});
TILE.roof=mk(16,16,x=>{P_(x,'R',0,0,16,16);for(let j=0;j<16;j+=4){P_(x,'k',0,j+3,16,1);for(let i=((j/4)%2)*4;i<16;i+=8)P_(x,'k',i,j,1,3);}P_(x,'r',0,0,16,1);});
TILE.barn=mk(16,16,x=>{P_(x,'r',0,0,16,16);for(let i=0;i<16;i+=4)P_(x,'R',i,0,1,16);P_(x,'w',0,0,16,2);P_(x,'k',0,2,16,1);P_(x,'R',0,15,16,1);});
TILE.door=mk(16,16,x=>{P_(x,'r',0,0,16,16);P_(x,'w',0,0,16,2);P_(x,'k',0,2,16,1);P_(x,'w',1,3,14,13);P_(x,'R',3,5,10,11);
  for(let k=0;k<10;k++){P_(x,'w',3+k,5+k);P_(x,'w',12-k,5+k);}});
TILE.croof=mk(16,16,x=>{P_(x,'B',0,0,16,16);for(let j=0;j<16;j+=4){P_(x,'b',0,j,16,3);for(let i=((j/4)%2)*4;i<16;i+=8)P_(x,'B',i,j,1,3);}});
TILE.cwall=mk(16,16,x=>{P_(x,'t',0,0,16,16);for(let j=0;j<16;j+=4)P_(x,'T',0,j+3,16,1);P_(x,'k',0,0,16,1);});
TILE.cdoor=mk(16,16,x=>{x.drawImage(TILE.cwall,0,0);P_(x,'k',3,4,10,12);P_(x,'B',4,5,8,11);P_(x,'y',5,13,6,3);P_(x,'Y',6,14,2,1);});
// farmhouse exterior
TILE.hroof=mk(16,16,x=>{P_(x,'U',0,0,16,16);for(let j=0;j<16;j+=4){P_(x,'k',0,j+3,16,1);for(let i=((j/4)%2)*4;i<16;i+=8)P_(x,'k',i,j,1,3);}P_(x,'u',0,0,16,1);});
TILE.hwall=mk(16,16,x=>{P_(x,'w',0,0,16,16);for(let j=3;j<16;j+=4)P_(x,'e',0,j,16,1);P_(x,'k',0,0,16,1);P_(x,'E',0,15,16,1);});
TILE.hwin=mk(16,16,x=>{x.drawImage(TILE.hwall,0,0);P_(x,'k',3,3,10,9);P_(x,'c',4,4,8,7);P_(x,'k',7,4,1,7);P_(x,'k',4,7,8,1);P_(x,'w',4,4,2,1);P_(x,'r',2,12,12,2);P_(x,'g',3,11,2,1);P_(x,'g',9,11,3,1);});
TILE.hdoor=mk(16,16,x=>{x.drawImage(TILE.hwall,0,0);P_(x,'k',3,2,10,14);P_(x,'b',4,3,8,13);P_(x,'B',4,8,8,1);P_(x,'T',5,4,6,3);P_(x,'T',5,10,6,4);P_(x,'q',10,9,1,1);});
TILE.garden=mk(16,16,x=>{P_(x,'b',0,0,16,16);for(let j=2;j<16;j+=5){P_(x,'B',0,j,16,2);P_(x,'T',0,j+2,16,1);}});
// interiors
TILE.floor=mk(16,16,x=>{P_(x,'t',0,0,16,16);for(let j=0;j<16;j+=4){P_(x,'T',0,j+3,16,1);P_(x,'T',(j%8?3:11),j,1,3);}});
TILE.straw=mk(16,16,x=>{P_(x,'t',0,0,16,16);const r=mulberry(123);for(let n=0;n<14;n++){const i=(r()*14)|0,j=(r()*15)|0;P_(x,n%3?'Y':'y',i,j,3,1);}});
TILE.wtop=mk(16,16,x=>{P_(x,'#2e1c10',0,0,16,16);P_(x,'#3a2416',0,7,16,1);P_(x,'#3a2416',7,0,1,7);P_(x,'#3a2416',12,8,1,8);});
TILE.wface=mk(16,16,x=>{P_(x,'b',0,0,16,16);for(let i=0;i<16;i+=4){P_(x,'B',i,0,1,16);P_(x,'T',i+1,0,1,16);}P_(x,'k',0,0,16,2);P_(x,'B',0,13,16,3);});
TILE.wwin=mk(16,16,x=>{x.drawImage(TILE.wface,0,0);P_(x,'k',3,3,10,9);P_(x,'c',4,4,8,7);P_(x,'k',7,4,1,7);P_(x,'k',4,7,8,1);P_(x,'w',4,4,2,1);P_(x,'w',8,8,1,1);});
TILE.hearth=mk(16,16,x=>{P_(x,'e',0,0,16,16);for(let j=0;j<16;j+=4){P_(x,'E',0,j+3,16,1);P_(x,'E',(j%8?4:11),j,1,3);}P_(x,'k',2,6,12,10);P_(x,'B',3,7,10,9);P_(x,'E',0,0,16,2);});
TILE.counter=mk(16,16,x=>{P_(x,'k',0,0,16,16);P_(x,'n',0,1,16,5);P_(x,'w',0,1,16,1);P_(x,'b',0,7,16,9);P_(x,'B',0,11,16,1);P_(x,'B',7,7,1,9);P_(x,'q',3,9,2,1);P_(x,'q',11,9,2,1);});
TILE.table=mk(16,16,x=>{x.drawImage(TILE.floor,0,0);P_(x,'k',0,2,16,11);P_(x,'b',0,3,16,8);P_(x,'T',0,3,16,1);P_(x,'B',0,10,16,1);P_(x,'k',2,13,2,3);P_(x,'k',12,13,2,3);});

function drawTile(ch,c,r,sx,sy,wf){
  const h=hash2(c,r);let img;
  switch(ch){
    case '.':img=TILE.grass[h%3];break;
    case ',':img=TILE.flower[h%2];break;
    case 'd':img=TILE.dirt;break;
    case 'p':img=TILE.patch;break;
    case 'm':img=TILE.mud;break;
    case 'r':img=TILE.reeds;break;
    case 'W':{ctx.drawImage(TILE.water[(wf+(c+r)%2)%2],sx,sy);ctx.fillStyle=PAL.c;
      if(tileAt(c,r-1)!=='W')ctx.fillRect(sx,sy,16,2);
      if(tileAt(c,r+1)!=='W'){ctx.fillRect(sx,sy+14,16,2);}
      if(tileAt(c-1,r)!=='W')ctx.fillRect(sx,sy,2,16);
      if(tileAt(c+1,r)!=='W')ctx.fillRect(sx+14,sy,2,16);
      return;}
    case 'F':{const v=(tileAt(c,r-1)==='F'||tileAt(c,r+1)==='F')&&tileAt(c-1,r)!=='F'&&tileAt(c+1,r)!=='F';img=v?TILE.fenceV:TILE.fenceH;break;}
    case 'H':img=TILE.tall;break;
    case 'T':img=TILE.tree;break;
    case 'A':img=G.picked[c+','+r]?TILE.tree:TILE.apple;break;
    case 'h':img=TILE.hay;break;
    case 'R':img=TILE.rock;break;
    case 'C':img=TILE.crate;break;
    case 'L':img=TILE.leaves;break;
    case 's':if(r>=48){ctx.drawImage(groundFor(c,r,h),sx,sy);img=TILE.signO;}else img=TILE.sign;break;
    case 'u':img=TILE.bush;break;
    case 'b':img=TILE.roof;break;
    case 'B':img=TILE.barn;break;
    case 'D':img=TILE.door;break;
    case 'v':img=(G.coop&&G.coop.lv>=4&&r>=48&&inSite(c,r))?TILE.goldroof:TILE.croof;break;
    case 'c':img=TILE.cwall;break;
    case 'K':img=TILE.cdoor;break;
    case 'j':img=TILE.hroof;break;
    case 'J':img=TILE.hwall;break;
    case 'I':img=TILE.hwin;break;
    case 'O':img=TILE.hdoor;break;
    case 'V':img=TILE.garden;break;
    case '#':img=FLOORISH.has(tileAt(c,r+1))||'ktenfyS'.includes(tileAt(c,r+1))?TILE.wface:TILE.wtop;break;
    case 'i':img=TILE.wwin;break;
    case '_':img=TILE.floor;break;
    case ':':img=TILE.straw;break;
    case 'n':img=TILE.nest;break;
    case 'X':img=(r>=36&&r<48)?(c<16?TILE.exitCave:TILE.exitStone):TILE.exit;break;
    case 'g':img=TILE.snow[h%2];break;
    case '~':img=TILE.sand[h%2];break;
    case '=':img=TILE.cobble;break;
    case 'N':img=TILE.cliff;break;
    case 'E':img=TILE.pine;break;
    case 'M':img=TILE.boulder;break;
    case 'q':img=G.picked[c+','+r]?TILE.tree:TILE.oak;break;
    case '2':img=TILE.palm;break;
    case '(':img=TILE.brock;break;
    case '3':img=TILE.planks;break;
    case 'x':img=TILE.dam[wf];break;
    case 'a':img=TILE.roofC;break;
    case 'U':img=TILE.brick;break;
    case 'Q':{ctx.drawImage(TILE.brickWin,sx,sy);if(nightAmt()>0.35){ctx.fillStyle='#ffd870';ctx.fillRect(sx+4,sy+4,3,3);ctx.fillRect(sx+8,sy+4,4,3);ctx.fillRect(sx+4,sy+8,3,4);ctx.fillRect(sx+8,sy+8,4,4);}return;}
    case 'l':img=TILE.awning;break;
    case '|':img=TILE.lamp;break;
    case '[':img=TILE.bench;break;
    case 'z':{ctx.drawImage(TILE.chasm,sx,sy);if(tileAt(c,r-1)!=='z'){ctx.fillStyle=PAL.E;ctx.fillRect(sx,sy,16,3);ctx.fillStyle='#e8f0f8';ctx.fillRect(sx,sy,16,1);}
      if(tileAt(c-1,r)!=='z'){ctx.fillStyle='#2a2238';ctx.fillRect(sx,sy,2,16);}if(tileAt(c+1,r)!=='z'){ctx.fillStyle='#2a2238';ctx.fillRect(sx+14,sy,2,16);}return;}
    case 'w':{ctx.drawImage(TILE.deep[(wf+(c+r)%2)%2],sx,sy);ctx.fillStyle='#6aa0e8';
      if(!'wx'.includes(tileAt(c,r-1)))ctx.fillRect(sx,sy,16,2);if(!'wx'.includes(tileAt(c-1,r)))ctx.fillRect(sx,sy,2,16);if(!'wx'.includes(tileAt(c+1,r)))ctx.fillRect(sx+14,sy,2,16);return;}
    case '$':{ctx.drawImage(TILE.cobble,sx,sy);ctx.fillStyle=PAL.k;ctx.fillRect(sx,sy,16,16);ctx.fillStyle=PAL.e;ctx.fillRect(sx,sy,16,16);
      ctx.fillStyle=PAL.u;const L=tileAt(c-1,r)!=='$',R=tileAt(c+1,r)!=='$',T=tileAt(c,r-1)!=='$',B=tileAt(c,r+1)!=='$';
      ctx.fillRect(sx+(L?3:0),sy+(T?3:0),16-(L?3:0)-(R?3:0),16-(T?3:0)-(B?3:0));ctx.fillStyle=PAL.c;const sp=Math.floor(tick/8)%3;
      if(!R&&!B){ctx.fillStyle=PAL.e;ctx.fillRect(sx+12,sy+12,4,4);ctx.fillStyle=PAL.c;ctx.fillRect(sx+13,sy+8-sp,2,4+sp);ctx.fillRect(sx+11+sp,sy+10,1,1);}
      else{ctx.fillRect(sx+4+((tick/10+c*5)%8|0),sy+6+(r%2)*4,3,1);}return;}
    case '!':{const h2=hash2(c,r);ctx.drawImage(groundFor(c,r,h2),sx,sy);ctx.fillStyle=PAL.T;
      if(tileAt(c,r-1)!=='!')ctx.fillRect(sx,sy+2,16,1);if(tileAt(c,r+1)!=='!')ctx.fillRect(sx,sy+13,16,1);
      if(tileAt(c-1,r)!=='!')ctx.fillRect(sx+2,sy,1,16);if(tileAt(c+1,r)!=='!')ctx.fillRect(sx+13,sy,1,16);
      ctx.fillStyle=PAL.B;if(tileAt(c-1,r)!=='!'&&tileAt(c,r-1)!=='!')ctx.fillRect(sx+1,sy,3,5);if(tileAt(c+1,r)!=='!'&&tileAt(c,r+1)!=='!')ctx.fillRect(sx+12,sy+11,3,5);return;}
    case '%':img='-X'.includes(tileAt(c,r+1))?TILE.caveFace:TILE.caveWall;break;
    case '-':img=TILE.caveFloor;break;
    case '&':img=';+0GX'.includes(tileAt(c,r+1))?TILE.stoneFace:TILE.stoneTop;break;
    case ';':img=TILE.stoneFloor;break;
    case '+':img=TILE.plate;break;
    case 'G':img=TILE.gate;break;
    case '0':img=TILE.barrel;break;
    case 'Z':img=TILE.crack;break;
    case 'Y':img=TILE.trap;break;
    case '^':img=TILE.hole;break;
    case '*':{ctx.drawImage(TILE.shroom,sx,sy);if(nightAmt()>0.3){const g=Math.floor(tick/20+c)%2;ctx.fillStyle=g?'#7ff0ff':'#b8fff4';
      [[4,9],[10,6],[11,12]].forEach(([i,j])=>ctx.fillRect(sx+i-1,sy+j-1,3,2));}return;}
    case '@':{ctx.drawImage(TILE.ring,sx,sy);if(nightAmt()>0.3){ctx.fillStyle=Math.floor(tick/12)%2?'#ff9cf0':'#d890ff';
      for(let a=0;a<8;a++){const i=Math.round(8+Math.cos(a*0.785+tick/40)*6),j=Math.round(8+Math.sin(a*0.785+tick/40)*5);ctx.fillRect(sx+i,sy+j,1,1);}}return;}
    case 'y':img=TILE.hayIn;break;
    case 'S':{const v=(tileAt(c,r-1)==='S'||tileAt(c,r+1)==='S')&&tileAt(c-1,r)!=='S'&&tileAt(c+1,r)!=='S';img=v?TILE.railV:TILE.railH;break;}
    case 'k':img=TILE.counter;break;
    case 't':img=TILE.table;break;
    case 'e':img=tileAt(c,r-1)==='e'?TILE.bedlow:TILE.bedtop;break;
    case 'P':img=TILE.plant;break;
    case 'o':{ctx.drawImage(TILE.rug,sx,sy);ctx.fillStyle=PAL.R;
      if(tileAt(c,r-1)!=='o')ctx.fillRect(sx,sy,16,2);if(tileAt(c,r+1)!=='o')ctx.fillRect(sx,sy+14,16,2);
      if(tileAt(c-1,r)!=='o')ctx.fillRect(sx,sy,2,16);if(tileAt(c+1,r)!=='o')ctx.fillRect(sx+14,sy,2,16);return;}
    case 'f':{ctx.drawImage(TILE.hearth,sx,sy);const fl=Math.floor(tick/6)%3;
      ctx.fillStyle=PAL.o;ctx.fillRect(sx+4,sy+10-fl,8,6+fl);ctx.fillStyle=PAL.y;ctx.fillRect(sx+6,sy+12-((fl+1)%3),4,4);
      ctx.fillStyle=PAL.w;ctx.fillRect(sx+7,sy+14,2,2);ctx.fillStyle=PAL.B;ctx.fillRect(sx+3,sy+15,10,1);return;}
    default:img=TILE.grass[0];
  }
  ctx.drawImage(img,sx,sy);
}

/* procedural chick: grows with each stage */
const chickCache=new Map();
function chickSprite(stage,dir,frame,flap){
  const key=stage+'|'+dir+'|'+frame+'|'+flap;let s=chickCache.get(key);if(s)return s;
  const side=dir===2,S=12+stage*2,Wd=S+(flap?10:0),Hd=S+1;
  const g=[...Array(Hd)].map(()=>Array(Wd).fill('.'));
  const put=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<Wd&&y<Hd)g[y][x]=c;};
  const ell=(cx,cy,rx,ry,c)=>{for(let y=0;y<Hd;y++)for(let x=0;x<Wd;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)g[y][x]=c;}};
  const cx=Wd/2,foot=Hd-1,ry=S*0.27,rx=S*0.36,by=foot-ry-0.3,hr=S*(0.30-stage*0.014);
  let hx=cx,hy=by-ry*0.55-hr*0.6;if(side)hx=cx-S*0.12;
  if(!flap){
    if(side){const a=frame?1:0;put(cx-1-a,foot,'o');put(cx+1+a-1,foot,'o');}
    else if(frame){put(cx-3,foot,'o');put(cx+2,foot,'o');}else{put(cx-2,foot,'o');put(cx+1,foot,'o');}
  }
  if(flap){const wy=by-ry*0.4+(frame?-2.5:1.5);
    ell(cx-rx-2.6,wy,4.4,2.3,'Y');ell(Wd-(cx-rx-2.6),wy,4.4,2.3,'Y');
    if(stage>=3){put(cx-rx-6,wy,'w');put(Wd-1-Math.floor(cx-rx-6),wy,'w');}}
  ell(cx+(side?S*0.06:0),by,rx,ry,'y');
  if(side&&!flap)ell(cx+S*0.14,by+0.3,rx*0.5,ry*0.6,'Y');
  if(!side&&!flap){ell(cx-rx+1.3,by+0.5,1.6,ry*0.62,'Y');ell(Wd-(cx-rx+1.3),by+0.5,1.6,ry*0.62,'Y');}
  if(side){put(cx+rx+S*0.06-0.5,by-ry*0.5,'Y');put(cx+rx+S*0.06+0.5,by-ry*0.8,'Y');}
  ell(hx,hy,hr,hr*0.95,'y');
  if(stage>=2){const t=Math.floor(hy-hr);put(hx-1,t,'r');put(hx,t,'r');put(hx,t-1,'r');if(stage>=3){put(hx+1,t,'r');put(hx-1,t-1,'r');}}
  if(dir===0){const xl=Math.floor(hx-hr*0.45),xr=Wd-1-xl,ey=Math.floor(hy);put(xl,ey,'k');put(xr,ey,'k');
    const by2=Math.floor(hy+hr*0.4);put(Wd/2-1,by2,'o');put(Wd/2,by2,'o');
    if(stage<2){put(xl-1,by2,'p');put(xr+1,by2,'p');}}
  else if(side){put(hx-hr*0.35,hy,'k');const byk=Math.floor(hy+hr*0.25);put(Math.floor(hx-hr)-1,byk,'o');put(Math.floor(hx-hr),byk,'o');
    if(stage<2)put(hx-hr*0.1,byk+1,'p');}
  s=makeSprite(g.map(r=>r.join('')));s.head={x:hx+1,y:hy+1,r:hr,top:hy-hr+1};s.S=S;chickCache.set(key,s);return s;
}
function getChick(stage,dir,frame,flap){return dir===3?flipOf(chickSprite(stage,2,frame,flap)):chickSprite(stage,dir,frame,flap);}
function decorate(base,fn){return mk(base.width,base.height,x=>{x.drawImage(base,0,0);fn(x);});}

let AC=null,master=null,musicGain=null,musicOn=true,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=musicOn?1:0;musicGain.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    startMusic();}catch(e){AC=null;}
}
function tone(f,d,type='square',v=0.1,slide=0,when=0,dest){
  if(!AC)return;const t=AC.currentTime+Math.max(0,when);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+0.03);
}
function noise(d,v=0.15,freq=1200){
  if(!AC)return;const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.05);
}

let curTrack='farm',wantTrack='farm',nextT=0,step=0,rainGain=null;
const mf=n=>440*Math.pow(2,(n-69)/12);
function startMusic(){
  nextT=AC.currentTime+0.1;
  // rain: looped filtered noise whose volume follows the weather
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=0.5;
  rainGain=AC.createGain();rainGain.gain.value=0;s.connect(f);f.connect(rainGain);rainGain.connect(master);s.start();
  setInterval(()=>{
    if(!AC)return;if(nextT<AC.currentTime-0.2)nextT=AC.currentTime+0.05;
    while(nextT<AC.currentTime+0.3){
      if(wantTrack!==curTrack&&step%8===0){curTrack=wantTrack;step=0;}
      const T=TRACKS[curTrack],STEP=60/T.bpm/2;
      const m=T.mel[step%64],bar=Math.floor((step%64)/8),bs=step%8,w=nextT-AC.currentTime;
      if(m)tone(mf(m),STEP*T.len,T.lead,T.lv,0,w,musicGain);
      if(bs%2===0)tone(mf(T.ch[bar][bs%4===0?0:1]),STEP*1.7,T.bass,T.bv,0,w,musicGain);
      nextT+=STEP;step++;
    }
  },60);
}

{

  const dpMove=e=>{const r=dp.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy);
    if(len<r.width*0.12){dpSet([]);return;}const nx=dx/len,ny=dy/len,d=[];

  dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpMove(e);});
  const dpEnd=e=>{if(e.pointerId===dpId){dpId=null;dpSet([]);}};

/* ---------------- collision ---------------- */
function rectTiles(x,y,w,h,forPlayer){
  const c0=Math.floor(x/16),c1=Math.floor((x+w-0.01)/16),r0=Math.floor(y/16),r1=Math.floor((y+h-0.01)/16);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(solidTile(tileAt(c,r),forPlayer))return true;return false;
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function entBox(e){
  if(e.type==='goose')return {x:e.x-7,y:e.y-12,w:14,h:16};
  if(e.type==='block')return {x:e.x-8,y:e.y-16,w:16,h:16};
  if(e.type==='chest')return {x:e.x-8,y:e.y-8,w:16,h:9};
  return {x:e.x-e.w/2,y:e.y-6,w:e.w,h:7};
}
function pBox(x,y){return {x:x-5,y:y-5,w:10,h:6};}
function pBlocked(x,y){
  const b=pBox(x,y);if(rectTiles(b.x,b.y,b.w,b.h,true))return true;
  const cur=pBox(P.x,P.y);
  for(const e of ents){if(!e.solid||e.blown)continue;const eb=entBox(e);if(ov(b,eb)&&!ov(cur,eb))return true;}
  return false;
}
function moveP(dx,dy,nudge){
  if(!dx&&!dy)return true;const nx=P.x+dx,ny=P.y+dy;
  if(!pBlocked(nx,ny)){P.x=nx;P.y=ny;return true;}
  if(nudge){
    if(dx){for(let k=1;k<=7;k++){
      if(!pBlocked(nx,P.y-k)&&!pBlocked(P.x,P.y-1)){P.y-=1;return true;}
      if(!pBlocked(nx,P.y+k)&&!pBlocked(P.x,P.y+1)){P.y+=1;return true;}}}
    else{for(let k=1;k<=7;k++){
      if(!pBlocked(P.x-k,ny)&&!pBlocked(P.x-1,P.y)){P.x-=1;return true;}
      if(!pBlocked(P.x+k,ny)&&!pBlocked(P.x+1,P.y)){P.x+=1;return true;}}}
  }
  return false;
}
function entBlocked(e,x,y){
  const sx=e.sx*256,sy=e.sy*192;if(x<sx+8||x>sx+248||y<sy+14||y>sy+188)return true;
  return rectTiles(x-6,y-5,12,6,false);
}
function entMove(e,dx,dy){if(!entBlocked(e,e.x+dx,e.y))e.x+=dx;if(!entBlocked(e,e.x,e.y+dy))e.y+=dy;}

/* ---------------- effects ---------------- */
function puff(x,y,n,colors,spd=1.2,grav=0.04){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*spd+0.3;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.6,g:grav,life:25+Math.random()*20,c:colors[(Math.random()*colors.length)|0]});}}
function float(x,y,s,color='#fff'){floats.push({x,y,s,color,life:60});}
function toast(s,color='#ffd83a'){toasts.push({s:tt(s),color,t:0});}
function updateAmbient(){
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=0.97;p.life--;}parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y-=0.35;f.life--;}floats=floats.filter(f=>f.life>0);
  if(toasts.length){toasts[0].t++;if(toasts[0].t>170)toasts.shift();}
  if(shake>0)shake--;
}

function hint(){
  if(G.part2)return hint2();
  if(G.q.mom<2)return "Peck 3 worms in the dirt patches!";
  if(G.skills.size===0)return "Press E to open your Growth Tree and spend your seeds!";
  for(const k in TRAIN){const t=TRAIN[k];if(t.phase===1&&G.train[k]===1)return t.hint();}
  for(const id of ORDER){if(G.q[id]===1&&QUESTS[id].check())return "Go tell "+NAMES[id]+" the good news!";}
  for(const id of ORDER){if(G.q[id]===0&&!G.met.has(id))return INTRO_HINT[id];}
  for(const id of ORDER){if(G.q[id]===1)return QUESTS[id].hint();}
  if(!has('fly'))return "You've grown so much! Keep spending seeds in your Growth Tree until you learn FLIGHT!";
  return "Go on, fly over that Big Fence! Mama is so proud of you!";
}

    if(!G.met.has('hootie_hi')){G.met.add('hootie_hi');it("Hoo-hoo! Welcome to the Moonlit Grove. Very few chicks have ever seen it.");}

  }

    if(G.items.letter){
      it("Bonjour! A letter from cousin Squeaks? How delightful!");
      it("*read read* ...Oh ho ho! Let me write back right away.");

    if(P.bubbleCd<=0){P.bubbleCd=240;float(P.x,P.y-24,'These mushrooms look magical...','#d890ff');}

    return;}

function startTrans(dx,dy){trans={dx,dy,t:0,d:40,px0:P.x,py0:P.y,px1:P.x+dx*14,py1:P.y+dy*12};}
function updateTrans(){

  camX=(CS.x+t.dx*e)*256;camY=(CS.y+t.dy*e)*192;P.x=lerp(t.px0,t.px1,p);P.y=lerp(t.py0,t.py1,p);P.moving=true;trailPush();

/* ---------------- main play update ---------------- */
function updatePlay(){
  if(trans){updateTrans();updateAmbient();return;}
  if(G.autoMom>0&&--G.autoMom===0){const m=ents.find(e=>e.id==='mom');if(m){talkTo(m);return;}}
  if(pressed.grow){openGrow();return;}
  if(pressed.quest){state='quests';questPage=G.part2?1:0;SFX.menu();return;}
  if(pressed.wear){openWardrobe();return;}
  if(pressed.fly){if(G.part2)openMap();return;}
  if(has('golden')&&tick%24===0)parts.push({x:P.x+(Math.random()-.5)*12,y:P.y-8-Math.random()*8,vx:0,vy:-0.3,g:0,life:20,c:'#ffd21e'});
  if(P.pushing>0)P.pushing--;else P.pushT=0;
  const ix=(keys.right?1:0)-(keys.left?1:0),iy=(keys.down?1:0)-(keys.up?1:0);
  P.moving=false;
  if(P.hop)updateHop();
  else if(P.kt>0){P.kt--;moveP(P.kx,0,false);moveP(0,P.ky,false);}
  else{
    if(ix||iy){
      if(ix&&iy){if(!((P.dir===2&&ix<0)||(P.dir===3&&ix>0)||(P.dir===1&&iy<0)||(P.dir===0&&iy>0)))P.dir=ix<0?2:3;}
      else P.dir=ix<0?2:ix>0?3:iy<0?1:0;
      const sp=speed()*(ix&&iy?0.72:1),single=!(ix&&iy);let mx=true,my=true;
      if(ix)mx=moveP(ix*sp,0,single);if(iy)my=moveP(0,iy*sp,single);
      P.moving=mx||my;trailPush();
      if(single&&((ix&&!mx)||(iy&&!my)))bump(ix,iy);
      if(state!=='play')return;
    }
    if(pressed.a){action();if(state!=='play')return;}
    if(pressed.b)wingFlap();
  }
  if(P.inv>0)P.inv--;if(P.peckT>0)P.peckT--;if(P.flapCd>0)P.flapCd--;if(P.flapAnim>0)P.flapAnim--;if(P.bubbleCd>0)P.bubbleCd--;
  if(state!=='play')return;
  if(P.moving&&!P.hop){
    P.stepT=(P.stepT||0)+1;const ch=tileAt(Math.floor(P.x/16),Math.floor((P.y-3)/16));
    if(onPuddle()&&P.stepT%12===0){SFX.splash();puff(P.x,P.y,6,['#a6d0ff','#5d8fd8','#fff8ec'],1,0.08);}
    else if(P.stepT%15===0&&ch!=='W')SFX.step('_'.includes(ch)?'wood':':'.includes(ch)?'straw':';-'.includes(ch)?'stone':'grass');
  }
  updateEnts();if(MG)updateMG();updateAmbient();checkPickups();if(state==='play')checkEdges();
}

/* =====================================================================
   WORLD SYSTEMS: day & night, weather, outfits, minigames, secrets

let MG=null,EG=null,drops=[],flies=[],flash=0,shopSel=0,shopMsg=null,wardSel=0;
function dayT(){return (G.clock%DAY)/DAY;}
function dayNum(){return Math.floor(G.clock/DAY)+1;}
function nightAmt(){
  if(!G)return 0;const t=dayT();
  if(t>=0.05&&t<0.55)return 0;if(t>=0.55&&t<0.65)return (t-0.55)/0.1;if(t>=0.65&&t<0.95)return 1;
  const u=t>=0.95?t-0.95:t+0.05;return Math.max(0,1-u/0.1);
}
function duskAmt(){return Math.max(0,1-Math.abs(dayT()-0.58)/0.07);}
function dawnAmt(){const t=dayT(),u=t>=0.9?t-1:t;return Math.max(0,1-Math.abs(u-0.03)/0.05);}
function isOutdoor(){const k=CS.x+','+CS.y;return WALK.has(k)||k==='2,3';}
function isCave(){return CS.y===3&&CS.x<2;}
function rainAmt(){return (G.weather==='rain'||G.weather==='storm')?G.wInt:0;}
function rollWeather(){
  const r=Math.random(),w=r<0.5?'clear':r<0.68?'cloudy':r<0.92?'rain':'storm';
  if(w===G.weather)return;G.weather=w;
  if(isOutdoor()&&state==='play'){if(w==='rain')toast("It's starting to rain!",'#a6d0ff');else if(w==='storm')toast('A storm is rolling in!','#a6d0ff');else if(w==='clear')toast('The sky is clearing up!');}
}
function onPuddle(){
  if(G.puddle<0.4||!WALK.has(CS.x+','+CS.y)||areaOf()==='mountains')return false;
  const c=Math.floor(P.x/16),r=Math.floor((P.y-3)/16);return '.,d=~'.includes(tileAt(c,r))&&hash2(c,r)%9===0;
}
function pickTrack(){
  if(state==='egg'||MG)return'mini';
  if(state==='map'||state==='flying'||state==='p2intro')return'grove';
  if(CS.y===3)return CS.x===2?'grove':'cave';
  if(CS.y===2||(CS.y===4&&CS.x===2))return'indoor';
  if(nightAmt()>0.45)return'night';
  if(CS.y>=4)return areaOf();
  if(CS.x===0&&CS.y===1)return'pond';
  return'farm';
}
function updateEnv(){
  const prev=dayT();G.clock++;const t=dayT();
  if(G.clock>DAY*0.5&&((prev<0.3&&t>=0.3)||(prev<0.8&&t>=0.8)))rollWeather();
  if(prev<0.04&&t>=0.04&&isOutdoor())SFX.crow();
  G.wInt+=((G.weather==='clear'?0:1)-G.wInt)*0.004;
  const rain=rainAmt(),out=isOutdoor(),n=nightAmt();
  G.puddle=clamp(G.puddle+(rain>0.5?0.0015:-0.0006),0,1);
  updatePlots();
  const snowy=areaOf()==='mountains';

    for(let i=0;i<k;i++)drops.push({x:Math.random()*(W+70),y:HUD-12-Math.random()*30,v:snowy?0.8+Math.random()*0.8:4+Math.random()*2,l:5+Math.random()*4,gy:HUD+16+Math.random()*(VH-16),snow:snowy,ph:Math.random()*6});}

  flies=flies.filter(f=>f.life>0&&out&&n>0.3&&f.x>camX-20&&f.x<camX+W+20&&f.y>camY-20&&f.y<camY+VH+20);
  if(out&&state==='play'){
    if(n>0.6&&tick%50===0&&Math.random()<0.6)SFX.cricket();
    if(n>0.7&&Math.random()<0.0015)SFX.hoot();

  }

/* lighting: a dark layer with glowing holes punched out around lights */
const lightC=document.createElement('canvas');lightC.width=W;lightC.height=VH;const lctx=lightC.getContext('2d');
function drawEnvFX(){
  const out=isOutdoor(),cave=isCave(),n=nightAmt();
  if(out){
    const wk=G.wInt*({clear:0,cloudy:0.06,rain:0.14,storm:0.24}[G.weather]);
    if(wk>0.005){ctx.fillStyle='rgba(20,30,60,'+(wk*0.45)+')';
      for(let i=0;i<3;i++){const span=W+200,x=Math.round(((i*170-tick*0.3)%span+span)%span-100),y=HUD+20+i*58;ctx.fillRect(x,y+6,90,22);ctx.fillRect(x+12,y,60,34);}
      ctx.fillStyle='rgba(40,50,90,'+wk+')';ctx.fillRect(0,HUD,W,VH);}
    const du=duskAmt(),da=dawnAmt();
    if(du>0){ctx.fillStyle='rgba(255,110,50,'+(du*0.18)+')';ctx.fillRect(0,HUD,W,VH);}
    if(da>0){ctx.fillStyle='rgba(255,150,190,'+(da*0.12)+')';ctx.fillRect(0,HUD,W,VH);}
    ctx.fillStyle='rgba(200,220,255,0.75)';
    for(const d of drops){if(d.snow)continue;for(let k=0;k<d.l;k++)ctx.fillRect(Math.round(d.x+k*0.35),Math.round(d.y-k),1,1);}
    ctx.fillStyle='#ffffff';for(const d of drops)if(d.snow)ctx.fillRect(Math.round(d.x),Math.round(d.y),2,2);
  }
  const dark=cave?0.62:out?n*0.68:n*0.3;
  if(dark>0.02){
    lctx.globalCompositeOperation='source-over';lctx.clearRect(0,0,W,VH);
    lctx.fillStyle=cave?'rgba(10,4,14,'+dark+')':'rgba(8,8,36,'+dark+')';lctx.fillRect(0,0,W,VH);
    lctx.globalCompositeOperation='destination-out';lctx.fillStyle='#000';
    const light=(x,y,r)=>{for(const [f,a] of [[1,0.3],[0.72,0.5],[0.46,1]]){lctx.globalAlpha=a;lctx.beginPath();lctx.arc(Math.round(x),Math.round(y),r*f,0,7);lctx.fill();}lctx.globalAlpha=1;};
    light(P.x-camX,P.y-camY-8-P.z,wearing('astronaut')?(cave?104:84):(cave?60:46));
    const c0=Math.floor(camX/16),r0=Math.floor(camY/16);
    for(let r=r0;r<=r0+12;r++)for(let c=c0;c<=c0+16;c++){const ch=tileAt(c,r),x=c*16-camX+8,y=r*16-camY+8;
      if(ch==='I')light(x,y+2,26);else if(ch==='f')light(x,y+4,48);else if(ch==='*')light(x,y,16);else if(ch==='@')light(x,y,22);
      else if(ch==='|')light(x,y-4,34);else if(ch==='Q')light(x,y+4,18);}
    for(const f of flies)light(f.x-camX,f.y-camY,10);
    for(const e of ents)if(e.type==='ffly'&&onCur(e))light(e.x-camX,e.y-camY-8,12);
    ctx.drawImage(lightC,0,HUD);
  }
  ctx.fillStyle='#f4ff8a';for(const f of flies)if(Math.sin(f.p*3)>-0.3)ctx.fillRect(Math.round(f.x-camX),Math.round(f.y-camY+HUD),2,2);
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.7)+')';ctx.fillRect(0,HUD,W,VH);}
}

  const m=MG;m.t++;
  if(m.type==='bonk'){
    const holes=ents.filter(e=>e.type==='hole');for(const h of holes)if(h.up>0)h.up--;
    if(Math.random()<0.035+m.t/1800*0.035){const free=holes.filter(h=>h.up<=0);
      if(free.length){const h=free[(Math.random()*free.length)|0];h.up=h.max=Math.round(80-m.t/1800*35);h.gold=Math.random()<0.12;SFX.pop();}}
  }else{
    const fl=ents.filter(e=>e.type==='ffly'),sx=CS.x*256,sy=CS.y*192;
    if(fl.length<9&&Math.random()<0.06)addEnt({type:'ffly',x:sx+40+Math.random()*176,y:sy+40+Math.random()*120,p:Math.random()*6,v:0.6+Math.random()*0.6+m.t/2400});

  else if(state==='p2intro')drawP2Intro();
  else if(state==='map'){drawWorld();drawEnvFX();drawHUD();TQ=[];drawMap();}
  else{
    drawWorld();drawEnvFX();drawHUD();
    if(state==='play'||state==='talk'||state==='ending'||state==='faint')drawFloats();
    if(state==='grow'){TQ=[];drawGrow();}
    else if(state==='quests'){TQ=[];drawQuests();}
    else if(state==='shop'){TQ=[];drawShop();}

/* ---------------- loop ---------------- */
function update(){
  tick++;
  if(pressed.mute){musicOn=!musicOn;if(musicGain)musicGain.gain.value=musicOn?1:0;if(G&&state!=='title')toast(musicOn?'Music on':'Music off','#a6e0ff');}
  if(fade>0&&(state==='play'||state==='title')&&!trans){fade=Math.max(0,fade-0.04);}
  if(G&&(state==='play'||state==='talk'||state==='warp'))updateEnv();
  wantTrack=state==='title'?'farm':state==='egg'?'mini':G?pickTrack():'farm';
  switch(state){
    case 'title':updateTitle();break;
    case 'play':G.time++;updatePlay();break;
    case 'talk':G.time++;updateTalk();updateAmbient();break;
    case 'shop':updateShop();break;
    case 'wardrobe':updateWardrobe();break;
    case 'egg':updateEgg();break;
    case 'sleep':updateSleep();break;
    case 'grow':updateGrow();updateAmbient();break;
    case 'quests':if(pressed.b&&G.part2){questPage^=1;SFX.menu();}else if(pressed.quest||pressed.back||pressed.a||pressed.grow){state='play';SFX.menu();}break;
    case 'map':updateMap();break;
    case 'flying':updateFlying();break;
    case 'p2intro':updateP2Intro();break;
    case 'faint':updateFaint();updateAmbient();break;
    case 'warp':updateWarp();updateAmbient();break;
    case 'ending':updateEnding();break;
  }
  for(const k in pressed)pressed[k]=false;
}
let last=performance.now(),acc=0;
function frame(now){
  const dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.floor(innerWidth*dpr)||cv.height!==Math.floor(innerHeight*dpr))resize();
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){update();acc-=1000/60;}
  if(tick%10===0)updateTouchUI();
  render();requestAnimationFrame(frame);
}
