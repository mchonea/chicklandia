let x,shipStage=3;
const R=(color,a,b,w=1,h=1)=&gt;{x.fillStyle=color;x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h));};
const poly=(color,points)=&gt;{x.fillStyle=color;x.beginPath();points.forEach(([a,b],i)=&gt;i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill();};
const line=(color,points,width=1)=&gt;{x.strokeStyle=color;x.lineWidth=width;x.beginPath();points.forEach(([a,b],i)=&gt;i?x.lineTo(a,b):x.moveTo(a,b));x.stroke();};
const label=(text,a,b,color=C.paper,size=8,align=&#x27;left&#x27;)=&gt;{x.font=size+&#x27;px ui-monospace,monospace&#x27;;x.textAlign=align;x.textBaseline=&#x27;top&#x27;;x.fillStyle=color;x.fillText(text,Math.round(a),Math.round(b));};
function rng(seed){return()=&gt;{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed&gt;&gt;&gt;0)/4294967296;};}
function sea(top=0,bottom=224,chart=false){
 R(chart?&#x27;#dcc38e&#x27;:C.deep,0,top,256,bottom-top);
 if(chart){for(let j=top+8;j&lt;bottom;j+=16)R(&#x27;#d4ba84&#x27;,8,j,240,1);return;}
 const colors=[C.deep,&#x27;#255780&#x27;,C.water,&#x27;#347aa7&#x27;];
 const band=(bottom-top)/4;colors.forEach((c,i)=&gt;R(c,0,top+i*band,256,band+1));
 const rand=rng(58);for(let i=0;i&lt;87;i++){const a=Math.floor(rand()*256),b=top+Math.floor(rand()*(bottom-top));R(i%5===0?C.foam:&#x27;#4a92b8&#x27;,a,b,2+Math.floor(rand()*5),1);if(i%6===0)R(&#x27;#1f527f&#x27;,a+2,b+2,9,1);}
}
function inside(a,b,p){let v=false;for(let i=0,j=p.length-1;i&lt;p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if(((yi&gt;b)!==(yj&gt;b))&amp;&amp;(a&lt;(xj-xi)*(b-yi)/(yj-yi)+xi))v=!v;}return v;}

function island(kind,a,b,scale=1,depth=3,chart=false){
 const p=shapes[kind]||shapes.cove;
 const q=p.map(([c,d])=&gt;[a+c*scale,b+d*scale]);
 const raw=(u,v)=&gt;inside(u,v,q)&amp;&amp;(kind!==&#x27;reef&#x27;||Math.hypot((u-a)/(14*scale),(v-b)/(10*scale))&gt;1);
 const step=2;const loX=Math.floor((a-33*scale)/step)*step,hiX=a+33*scale,loY=Math.floor((b-28*scale)/step)*step,hiY=b+29*scale;

    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
